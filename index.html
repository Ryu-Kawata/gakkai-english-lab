and cheaply as we test electronic chips today. If you work on any of these, I think you'll have a very interesting career. Thank you very much for your attention."},{"who":"Chair","en":"Thank you for a very clear and comprehensive tutorial. We have a few minutes for questions. Yes, please, go ahead."},{"who":"Audience","en":"Thank you for the excellent overview. You mentioned that the laser is the elephant in the room. In your opinion, which of the three integration approaches will dominate for co-packaged optics in, say, five years?"},{"who":"Lecturer","en":"That's the question everyone asks me, and I'll give you an honest answer: I don't know. But I can tell you how I think about it. For the first generations, I'm fairly confident that external laser sources will dominate, mainly because of serviceability and because the thermal environment next to the switch is so harsh. In the longer term, if heterogeneous integration can demonstrate good reliability at high temperatures, it could become very attractive, because it removes a lot of packaging complexity. So my short answer is: external lasers first, and then we'll see."},{"who":"Chair","en":"Great. Let's thank the speaker once again."}],"quiz":[{"q":"光を配線に使う根本的な理由は？","a":"距離と帯域。銅配線は高周波・長距離で損失が大きく（数十cmで30 dB以上）、補償回路が電力を食う。ファイバ損失はデータセンター内ではほぼゼロ。"},{"q":"SOIの典型的な構造と、高屈折率差の利点・欠点は？","a":"Si 220 nm、埋込酸化膜2〜3 μm。光閉じ込めが強く曲げ半径数μmで高密度だが、側壁荒れの散乱で損失1〜3 dB/cmと大きい。"},{"q":"グレーティングカプラとエッジカプラの比較は？","a":"グレーティング：ウェハ検査可能・トレランス大だが偏波依存・帯域狭い。エッジ：低損失・広帯域・偏波無依存だが端面研磨と精密調芯が必要。"},{"q":"シリコン変調器の原理は？","a":"線形電気光学効果がないため、キャリアプラズマ分散効果を使う。PN接合を逆バイアスし空乏層幅を変える（キャリア空乏型）。"},{"q":"MZ変調器とリング変調器のトレードオフは？","a":"MZ：広帯域・温度に強いが長く高電圧。リング：小型・低電圧・WDM向きだが約80 pm/℃と温度に敏感でヒーター制御が必要。"},{"q":"モジュールのコストの大部分を占めるのは？","a":"実装と検査（半分以上と言われる）。"},{"q":"エネルギー/ビットを比較するときの注意は？","a":"レーザーや電気インタフェースを含むかなど定義が論文ごとに違う。何が含まれているかを必ず確認する。"},{"q":"講演者が挙げた4つの課題は？","a":"①レーザー ②ファイバ実装（パッシブ調芯・高密度） ③熱制御 ④ウェハレベル検査。"}],"vocab":[{"en":"underestimated","ja":"過小評価された"},{"en":"centrosymmetric","ja":"中心対称な"},{"en":"plasma dispersion effect","ja":"キャリアプラズマ分散効果"},{"en":"the elephant in the room","ja":"皆が分かっているが触れにくい大問題"},{"en":"rule of thumb","ja":"経験則"},{"en":"figure of merit","ja":"性能指標"}],"file":"audio/E01_e01.mp3","dur":701},{"id":"e02","cat":"long","title":"Invited talk: Optical wafer inspection, from bright-field to computational imaging","ja":"招待講演：光学ウェハ検査（明視野からコンピュテーショナルイメージングまで）","kind":"講義","voice":"en-GB-ThomasNeural","accent":"イギリス・アメリカ・韓国語なまり・オーストラリア","segments":[{"who":"Chair","en":"Our next speaker is an invited speaker, who has been working on optical inspection systems for semiconductor manufacturing for many years. The title of the talk is: Optical wafer inspection, from bright-field to computational imaging. Please."},{"who":"Speaker","en":"Thank you, and thank you to the organizers for inviting me. I'd like to give you a bit of a story today, starting from the basic question of why we still use optics for inspection, then looking at the main techniques, and finishing with where I think the field is going, which is towards computational approaches."},{"who":"Speaker","en":"So, let's start with the basic problem. In a modern semiconductor fab, a wafer goes through hundreds of process steps. At almost any of those steps, something can go wrong. A particle can land on the surface, a pattern can be printed incorrectly, a film can be scratched. Some of these defects are harmless, but some of them will kill the chip. And the critical dimensions are now only a few tens of nanometers, and in some layers even less. The industry needs to find these defects quickly, so that the problem can be fixed before thousands of wafers are affected. This is what we call yield management, and inspection is at the heart of it."},{"who":"Speaker","en":"Now, you might ask: if the defects are so small, why not just use an electron microscope? Electron beams certainly have the resolution. The problem is speed. A scanning electron microscope might take hours to image a small fraction of a single wafer. An optical inspection tool can scan an entire three-hundred-millimeter wafer in a matter of minutes. So in practice, the industry uses a two-step approach. Optical tools scan the whole wafer and find candidate defects. Then a smaller number of those candidates are sent to an electron-beam review tool, which takes high-resolution images so that engineers can classify them. Optics is the fast net; electrons are the magnifying glass."},{"who":"Speaker","en":"But here's the interesting thing. Many of the defects we need to find are smaller than the optical resolution. If you remember the Rayleigh criterion, the resolution is about zero point six one times the wavelength divided by the numerical aperture. Even with deep ultraviolet light, around one hundred ninety to two hundred sixty nanometers, and a numerical aperture close to one, the resolution is on the order of one hundred nanometers or more. So how can we possibly find a fifteen-nanometer defect? The key point is that detection is not the same as resolution. We don't need to see the shape of the defect. We just need to know that something is different at a certain location. A small defect still scatters a little bit of light, or slightly changes the reflected light, and if we can detect that change above the noise, we've found it."},{"who":"Speaker","en":"This leads to the two classic families of optical inspection: bright-field and dark-field. In bright-field inspection, we collect the specularly reflected light, as in a normal microscope. The image contains the pattern, and a defect appears as a small change in the image. In dark-field inspection, we illuminate the wafer at an angle and block the specular reflection, so we only collect scattered light. On a smooth surface, the background is dark, and defects appear as bright spots. Dark-field is extremely sensitive and fast for unpatterned wafers and for particles. Bright-field is generally better for patterned wafers, where we need to detect pattern defects like bridges or breaks."},{"who":"Speaker","en":"For patterned wafers, there's another important trick, which is comparison. Every wafer contains many identical dies. So instead of trying to decide whether an image looks correct on its own, the tool compares the image of one die with the images of its neighbors. If there is a difference at one location in one die, but not in the others, that's a defect candidate. This is called die-to-die comparison, and it's been the workhorse of patterned wafer inspection for decades. The challenge is that it's very sensitive to noise. Small variations in film thickness, slight focus errors, or color variations between dies can all create differences that are not real defects. We call these nuisance defects, and dealing with nuisance is, frankly, a huge part of the job of an inspection engineer."},{"who":"Speaker","en":"Let me put this in terms of a trade-off triangle that I find helpful. Inspection is always a compromise between sensitivity, throughput, and cost. If you want higher sensitivity, you can use shorter wavelengths, higher numerical apertures, smaller pixels, and longer integration times. But smaller pixels and longer integration times mean lower throughput. If you want both sensitivity and throughput, you need brighter light sources, faster sensors, and more computing power, which means higher cost. Every tool on the market sits somewhere inside this triangle, and different process steps need different points in the triangle."},{"who":"Speaker","en":"Now, let me turn to the more recent developments. Over the last ten years or so, two trends have changed the field. The first is that the defects of interest are often not on the surface anymore. With three-dimensional structures, like 3D NAND memory with hundreds of stacked layers, or gate-all-around transistors, the critical defects can be buried deep inside the structure. Conventional imaging, which mostly looks at the top surface, struggles here. People are exploring longer wavelengths, which penetrate deeper, as well as techniques that use polarization and angle-resolved information to extract depth information."},{"who":"Speaker","en":"The second trend is computation. Traditionally, the optics was designed to form the best possible image, and the image processing was relatively simple: align, subtract, and threshold. Today, we have enormous computing power, and we can think about the optics and the computation together. This is what I mean by computational imaging. For example, instead of collecting one image, we can collect several images under different illumination angles or polarizations, and then combine them computationally to enhance the defect signal and suppress the pattern. Or we can use a physical model of the optical system to predict what the image of a defect-free die should look like, and compare the measured image with this prediction instead of with the neighboring die."},{"who":"Speaker","en":"And of course, machine learning has become part of this story. Deep learning is very good at the classification problem: is this candidate a real defect or a nuisance, and if it's real, what type is it? Several groups, including ours, have shown that machine learning can reduce nuisance rates significantly without losing real defects. But I want to add a note of caution here. In a fab, the cost of missing a killer defect can be enormous. So we need models that are not only accurate on average, but also reliable on rare events, and we need to understand when the model is uncertain. In my view, combining physics-based models with machine learning is much more promising than treating the problem as a pure black box."},{"who":"Speaker","en":"Let me show you one example from our recent work, just to make this concrete. We looked at a layer with a dense line-and-space pattern, where the defect of interest was a very small bridge between two lines. With conventional die-to-die comparison, the defect signal was buried in the variation of the pattern. By collecting images at three illumination angles and using a simple physics-informed model to combine them, we improved the signal-to-noise ratio by about a factor of four. Then a small neural network, trained mostly on simulated data, reduced the nuisance rate by roughly seventy percent. Neither the optics alone nor the machine learning alone achieved this. It was the combination."},{"who":"Speaker","en":"To conclude, optical inspection is far from a mature or finished field. The defects are getting smaller and more hidden, the structures are getting more three-dimensional, and the amount of data is exploding. I believe the next generation of inspection systems will be designed as a whole, with the optics, the sensors, and the algorithms optimized together. And for those of you who are students, this is a field where knowledge of optics, physics, and data science all come together, which makes it a very exciting place to work. Thank you."},{"who":"Chair","en":"Thank you for this fascinating talk. Questions? Yes, in the middle."},{"who":"Audience 1","en":"Thank you. You said you trained the network mostly on simulated data. How did you make sure the simulation was realistic enough?"},{"who":"Speaker","en":"Great question. The short answer is calibration. We measured a set of reference structures on the real tool and adjusted the parameters of the simulation, things like focus, aberrations, and noise level, until the simulated images matched the measured ones. Then we validated the model on a small set of real defects that had been confirmed by electron-beam review. It's not perfect, but it was good enough to be useful."},{"who":"Audience 2","en":"You mentioned buried defects in 3D structures. Do you think optics can really solve that, or will we eventually need X-ray methods?"},{"who":"Speaker","en":"That's a very fair question, and I think the honest answer is: both. Optics will remain the fast, first-pass method, and we'll keep pushing it as far as we can with polarization and computation. But for some deeply buried defects, X-ray or other techniques will probably be needed, at least for sampling. The trick will be combining them intelligently."},{"who":"Chair","en":"Thank you. Let's thank our speaker again."}],"quiz":[{"q":"なぜ電子顕微鏡だけで検査しないのか？","a":"遅いから。SEMはウェハのごく一部に何時間もかかる。光学で全面を数分で走査し、候補だけを電子線レビューに送る2段階方式。"},{"q":"分解能より小さい欠陥を見つけられる理由は？","a":"検出は解像とは違う。形が見えなくても、散乱や反射のわずかな変化をノイズより上で検出できればよい。"},{"q":"明視野と暗視野の違いと得意分野は？","a":"明視野は正反射光を集め、パターン付きウェハのパターン欠陥向き。暗視野は斜め照明で正反射を遮り散乱光だけを集め、パターンなしウェハや粒子に高感度・高速。"},{"q":"ダイ・トゥ・ダイ比較とその弱点は？","a":"同じダイ同士の画像を比較し差分を欠陥候補とする。膜厚・フォーカス・色ムラで偽欠陥（ニューサンス）が出やすい。"},{"q":"トレードオフの三角形は？","a":"感度・スループット・コスト。"},{"q":"最近の2つの潮流は？","a":"①3D構造で欠陥が内部に埋もれる ②計算（コンピュテーショナルイメージング、物理モデル、機械学習）。"},{"q":"具体例の結果は？","a":"3つの照明角度の画像を物理モデルで合成しSNR約4倍、主にシミュレーションで学習したNNでニューサンス約70%減。組み合わせが効いた。"},{"q":"シミュレーションの現実性はどう担保したか？","a":"実機で参照構造を測ってフォーカス・収差・ノイズを合わせ込み（校正）、電子線で確認済みの実欠陥で検証した。"}],"vocab":[{"en":"yield management","ja":"歩留まり管理"},{"en":"candidate defect","ja":"欠陥候補"},{"en":"specular reflection","ja":"正反射"},{"en":"nuisance defect","ja":"ニューサンス（偽欠陥）"},{"en":"buried defect","ja":"埋没欠陥"},{"en":"sampling","ja":"抜き取り検査"}],"file":"audio/E02_e02.mp3","dur":597},{"id":"e03","cat":"long","title":"Panel discussion: The road to co-packaged optics","ja":"パネルディスカッション：コパッケージド・オプティクスへの道","kind":"パネル討論","voice":"en-US-AndrewNeural","accent":"アメリカ・インド・ドイツ語なまり・中国語なまり・日本語なまり・アイルランド","segments":[{"who":"Moderator","en":"Welcome, everyone, to this evening's panel on the road to co-packaged optics. We have four panelists with very different perspectives: Priya, who leads an optical interconnect team at a hyperscale data center operator; Markus, who works on packaging and reliability at a semiconductor company; Wei, a professor working on integrated lasers; and Sato, who works on photonic switch systems at a telecom research lab. I'd like each of you to briefly introduce yourself and answer one question: in one sentence, what is the biggest obstacle to the large-scale deployment of co-packaged optics? Priya, let's start with you."},{"who":"Priya","en":"Thanks. So, I'm Priya, and my team designs the optical network inside our data centers. In one sentence, I'd say the biggest obstacle is operational: we don't yet have the confidence that we can deploy, monitor, and repair co-packaged systems at the scale of hundreds of thousands of switches."},{"who":"Markus","en":"Hello, I'm Markus. I work on advanced packaging and reliability. For me the biggest obstacle is very clear: it's the fiber. Getting many fibers into a package, with low loss, at high volume, and with good long-term reliability, is still extremely difficult."},{"who":"Wei","en":"Hi everyone, I'm Wei. My group works on lasers integrated with silicon photonics. Of course I will say the laser. The laser must be efficient, reliable at high temperature, and cheap. Today we can have two of these three, but not all three at the same time."},{"who":"Sato","en":"Thank you. I'm Sato from Tokyo. We work on optical switching systems. I think the biggest obstacle is the ecosystem. Co-packaged optics needs many companies to agree on standards, interfaces, and business models. Technology is important, but without the ecosystem, it will not be deployed widely."},{"who":"Moderator","en":"So we have four different answers already, which is a good sign for an interesting discussion. Priya, let me come back to you. You said the main issue is operational. Can you give us a concrete example of what worries you?"},{"who":"Priya","en":"Sure. Today, if a pluggable transceiver fails, a technician walks to the rack, pulls out the module, and plugs in a new one. It takes a few minutes. With co-packaged optics, the optical engine is inside the switch package. If a laser fails, what do we do? If the answer is: replace the entire switch, then that's a big problem, both for cost and for downtime. That's why we strongly prefer architectures where the laser is external and field-replaceable. And we also need much better monitoring. We want to know that a component is degrading before it actually fails."},{"who":"Moderator","en":"Wei, as a laser person, how do you react to that? Is external laser the right answer?"},{"who":"Wei","en":"I think for the first generation, yes, it is a reasonable answer, and I agree with Priya. But external lasers also have a cost. You need extra fibers, extra connectors, and you lose some optical power in the path. Each connector may cost you half a dB or more. So in the long term, I believe integrated lasers can win, but only if we can prove their reliability. And to be honest, the reliability data for integrated lasers at high temperature is still limited. This is something the research community must work on."},{"who":"Moderator","en":"Markus, you said the fiber is the biggest obstacle. Many people outside the field are surprised by that. Why is it so hard?"},{"who":"Markus","en":"Yes, people are always surprised. Let me explain. A modern switch may need more than one thousand fibers. Each fiber must be aligned to a waveguide with sub-micrometer accuracy. With active alignment, where you move the fiber while measuring the optical power, this takes time, maybe tens of seconds per fiber or more. That is too slow and too expensive for high volume. So we need passive alignment, where mechanical features guarantee the position. But passive alignment needs very tight tolerances on every part. Then, the package goes through solder reflow at around two hundred sixty degrees, and later it operates for years with temperature cycles. The adhesives and materials must survive all this without moving even a fraction of a micrometer. This is a very hard materials and mechanical problem, not only an optical problem."},{"who":"Moderator","en":"Sato, you mentioned the ecosystem. There's also a competing approach that's become very popular recently, which is linear pluggable optics, where we keep pluggable modules but remove the DSP. Does that make co-packaged optics less necessary?"},{"who":"Sato","en":"That is a very good question, and it is a hot topic. Linear pluggable optics can reduce power significantly while keeping the operational model that Priya likes. So for the next few years, I think linear pluggables will be very competitive. However, as the lane speed goes to two hundred gigabits and then four hundred gigabits per second, the electrical channel to the front panel becomes more and more difficult. At some point, I believe the physics will push us to co-packaged optics. The question is only when. Maybe the answer depends on the application. For AI clusters, where the bandwidth demand is extreme, co-packaged optics may come earlier."},{"who":"Priya","en":"Can I jump in here? I agree with Sato. For us, it's not a religious question. We will use whatever gives us the best total cost of ownership, including power, cost, and reliability. Right now, for many applications, that's still pluggables. But for the largest AI training clusters, the power savings of co-packaged optics are becoming very attractive, because power is now the main limit on how big we can build a cluster."},{"who":"Moderator","en":"That's an interesting point: power as the main limit. Wei, from a research perspective, where do the biggest power savings come from?"},{"who":"Wei","en":"If we look at the energy breakdown, removing the DSP and retimers gives the biggest saving, and this comes almost automatically when the optics is close to the switch. After that, the laser is often the largest part. A typical laser has a wall-plug efficiency of maybe ten to twenty percent, and then we lose more power in coupling and in the optical path. So improving laser efficiency and reducing optical loss gives the next big saving. Thermal tuning of micro-rings is also significant. So I would say: first remove electronics, then improve the laser, then reduce tuning power."},{"who":"Moderator","en":"Markus, what about reliability standards? How do we qualify something like this?"},{"who":"Markus","en":"This is another challenge. For electronic packages, we have well-established qualification standards, and for pluggable optical modules, we also have standards. For co-packaged optics, we need to combine the two, and there are new failure modes. For example, contamination of an optical interface inside the package, or slow movement of a fiber due to adhesive creep. We don't have decades of field data, so we have to rely on accelerated testing, and we must be careful to make sure the acceleration models are correct."},{"who":"Moderator","en":"Let's take a question from the audience. Yes, please."},{"who":"Audience","en":"Thank you. My question is for all panelists. I'm a PhD student working on silicon photonics. If you were starting your career now, which skill would you focus on to be most useful for this field?"},{"who":"Markus","en":"I can start. I would say: learn about packaging and thermal-mechanical design. Many students know photonics very well, but very few understand materials, adhesives, and thermal stress. These people are extremely valuable in industry."},{"who":"Wei","en":"I agree with Markus, but I will add: learn to measure carefully. Good measurement skills, understanding uncertainty, and honest reporting of data. In our field, many papers report numbers that are difficult to compare, so people who can do careful, fair measurements are very important."},{"who":"Sato","en":"From my side, I recommend understanding the system, not only the device. If you know how your device will be used in a real network or switch, you can design it much better. And also, please, practice communication in English. In international projects, the ability to explain your idea clearly is as important as the idea itself."},{"who":"Priya","en":"I'll add one more: learn some software. Whether it's data analysis, automation of measurements, or simulation, coding skills multiply what you can do. And talk to people from industry at conferences like this one. Don't be shy. Most of us are very happy to talk to students."},{"who":"Moderator","en":"That's great advice, and I think it's a good place to finish. Let me quickly summarize what I heard tonight. Co-packaged optics is technically very attractive, especially for AI clusters where power is the main limit. But the obstacles are not only optical: they include serviceability, fiber attach, laser reliability, qualification standards, and the ecosystem. Linear pluggables will be a strong competitor in the near term. And for students, the advice is to combine photonics with packaging, careful measurement, systems thinking, software, and communication skills. Please join me in thanking our panelists."}],"quiz":[{"q":"4人のパネリストが挙げた最大の障害は？","a":"Priya：運用（大規模での展開・監視・修理）、Markus：ファイバ実装、Wei：レーザー（効率・高温信頼性・低コストの両立）、Sato：エコシステム（標準・インタフェース・ビジネスモデル）。"},{"q":"Priyaが外部光源を好む理由は？","a":"レーザー故障時にスイッチ全体を交換したくない。現場で交換できること、故障前に劣化を監視できることが重要。"},{"q":"外部光源のデメリット（Weiの意見）は？","a":"ファイバ・コネクタが増え、光パワーを失う（コネクタ1つで0.5 dB以上）。長期的には集積レーザーが有利になりうるが、高温信頼性データが不足。"},{"q":"ファイバ実装が難しい理由は？","a":"1000本以上をサブμm精度で合わせる必要。アクティブ調芯は遅すぎ、パッシブ調芯は全部品に厳しい公差が必要。260℃リフローや温度サイクルでも動かない材料が必要。"},{"q":"LPO（リニアプラガブル）とCPOの関係についてのSatoの見解は？","a":"当面はLPOが有力。だがレーン速度が200→400 Gb/sに上がると前面までの電気配線が難しくなり、物理的にCPOへ向かう。AIクラスタでは早く来るかも。"},{"q":"電力削減の優先順位（Wei）は？","a":"①DSP・リタイマー除去 ②レーザー効率改善と光損失低減 ③リングの熱チューニング電力削減。"},{"q":"学生へのアドバイスは？","a":"実装・熱機械設計（Markus）、丁寧な測定と誠実な報告（Wei）、システム理解と英語での説明力（Sato）、ソフトウェアと産業界の人と話すこと（Priya）。"}],"vocab":[{"en":"hyperscale","ja":"超大規模（データセンター事業者）"},{"en":"field-replaceable","ja":"現場で交換可能な"},{"en":"total cost of ownership","ja":"総保有コスト"},{"en":"adhesive creep","ja":"接着剤のクリープ（ゆっくりした変形）"},{"en":"accelerated testing","ja":"加速試験"},{"en":"jump in","ja":"（会話に）割り込む"}],"file":"audio/E03_e03.mp3","dur":643},{"id":"e04","cat":"long","title":"Podcast: Surviving your first international conference","ja":"ポッドキャスト：初めての国際学会を乗り切る","kind":"雑談・会話","voice":"en-AU-NatashaNeural","accent":"オーストラリア・アイルランド","segments":[{"who":"Host","en":"Hi everyone, and welcome back to Lab Coffee, the podcast where we talk about the human side of research. I'm your host, and today I'm joined by a good friend of mine, who's a postdoc in an optics lab and has been to, what, twenty conferences now?"},{"who":"Guest","en":"Something like that, yeah. I stopped counting at some point. Thanks for having me."},{"who":"Host","en":"So today's topic is a request from a lot of our listeners: how to survive your first international conference, especially if English isn't your first language, or if you're a bit shy. Let's start with you. Do you remember your first conference?"},{"who":"Guest","en":"Oh, I remember it very well, because it was a bit of a disaster, to be honest. It was in San Francisco, I was a second-year PhD student, and I had a poster. I'd prepared the poster really carefully, but I had not prepared myself at all. So the first person who came to my poster said, \"Hi, can you tell me about your work?\" and I just froze. I started reading the abstract out loud, word by word. You could see the guy's eyes glazing over."},{"who":"Host","en":"Oh no. I think everyone has a story like that."},{"who":"Guest","en":"Totally. And the lesson I learned was simple: you need a short version of your story, ready to go. Not the abstract, not the full paper, but like a thirty-second version that you can say naturally. What's the problem, what did you do, and why should anyone care. After that first day, I went back to the hotel, wrote my thirty-second version, practiced it in front of the mirror maybe twenty times, and the next day it was completely different."},{"who":"Host","en":"That's such good advice. And I think it also helps to have different versions for different people, right? Like, if an expert in your exact field comes by, you can skip the background."},{"who":"Guest","en":"Exactly. I always start by asking, \"What do you work on?\" That's a great opener, because it gives you a moment to breathe, and then you know who you're talking to. If they say they work on the same thing, I go straight to the results. If they're from a different field, I spend more time on the motivation. And sometimes they're from industry, and then they usually want to know: does it work, how fast, how much does it cost."},{"who":"Host","en":"Let's talk about oral presentations, because that's what scares people the most. What's your advice for the talk itself?"},{"who":"Guest","en":"So, a few things. First, don't write a script with long, complicated sentences. When you read a complicated sentence out loud, it sounds unnatural, and if you lose your place, you panic. Use short sentences. One idea per sentence. Second, practice the beginning and the end until they're automatic. The first thirty seconds are when you're most nervous. If those are automatic, you calm down and the rest flows. And the last sentence should be clear, so people know you've finished and they can clap. Nothing is more awkward than a talk that just kind of fades out."},{"who":"Host","en":"Ha, yes, the awkward silence. \"Um, so... that's it?\""},{"who":"Guest","en":"Right, exactly. Just say, \"To summarize,\" give your three points, and then, \"Thank you for your attention.\" Done. And third, practice with the actual slides and a timer. Conference sessions are very strict about time. If you go over, the chair will cut you off, and you'll lose the Q and A, which is often the most valuable part."},{"who":"Host","en":"Okay, so let's talk about Q and A, because I think for a lot of people, that's actually scarier than the talk itself. You can prepare the talk, but you can't control the questions."},{"who":"Guest","en":"Yeah, absolutely. But actually, you can prepare more than you think. Most questions fall into a few categories. Why did you choose this method? How does it compare with other approaches? What are the limitations? What's next? If you prepare a short answer for each of those, you'll be ready for maybe seventy percent of the questions."},{"who":"Host","en":"And what about when you don't understand the question? That happens a lot, especially with different accents and a noisy room."},{"who":"Guest","en":"That happens to native speakers too, by the way. It's completely normal to say, \"Sorry, could you repeat the question?\" Or even better, try to rephrase it: \"So, if I understand correctly, you're asking whether this works at higher temperatures?\" That gives you time to think, it confirms that you understood, and it helps the audience, because they often can't hear the question either. The chair will actually appreciate it."},{"who":"Host","en":"I love that. And what if you just don't know the answer?"},{"who":"Guest","en":"Then say so. Honestly, it's much better than making something up. You can say, \"That's a great question. We haven't looked into that yet, but it's definitely something we'd like to investigate.\" Or, \"I'm not sure, but I can check and get back to you.\" Nobody expects you to know everything, especially as a student. What people don't like is when someone clearly doesn't know and talks for two minutes without saying anything."},{"who":"Host","en":"Right. Okay, now the part I personally find the hardest: networking. Coffee breaks, the banquet, all of that. Any tips for people who are a bit introverted?"},{"who":"Guest","en":"Oh, I'm an introvert too, so I really get it. A few tricks that work for me. First, go to the talks of people you want to meet, and then go up to them afterwards with a question about their talk. That's the easiest way to start a conversation, because you already have a topic. Second, at coffee breaks, stand near the coffee, not in a corner. People are moving around, and it's natural to say, \"Hi, how are you enjoying the conference?\" Third, it's okay to join a group. Just stand there, listen, and when there's a natural pause, introduce yourself."},{"who":"Host","en":"And what do you actually talk about? Because I think people worry they'll run out of things to say."},{"who":"Guest","en":"The standard topics are pretty safe. Which talks did you like? Where are you from? When did you arrive? Is this your first time in this city? And then, of course, research. People love talking about their own research, so if you ask good questions, the conversation keeps going on its own. A question I like is, \"What's the hardest part of your project?\" People always have an interesting answer to that."},{"who":"Host","en":"That's a great one. I'm stealing that."},{"who":"Guest","en":"Go ahead. Oh, and another thing: don't just talk to the famous professors. Talk to other students and postdocs. They're the people you'll be working with for the next twenty years. Some of my closest collaborators now are people I met at coffee breaks when we were all students."},{"who":"Host","en":"That's so true. And what about after the conference? How do you follow up?"},{"who":"Guest","en":"Send a short email within a week, while they still remember you. Something like, \"Hi, it was great talking to you at the poster session about your OCT work. As promised, here's the link to our paper.\" Short and specific. And connect on LinkedIn or whatever people use in your field. That's it. You don't need to write a long letter."},{"who":"Host","en":"Before we wrap up, any final advice for someone who's nervous about their English?"},{"who":"Guest","en":"Yeah. I'd say: remember that at an international conference, most people are not native speakers. The audience is used to all kinds of accents. Nobody cares if your grammar is perfect. What matters is that your message is clear and that you're willing to communicate. Speak a little slower than you think you need to, use simple words, and smile. Honestly, the people who do best at conferences are not the ones with perfect English. They're the ones who are curious and friendly."},{"who":"Host","en":"Curious and friendly. I think that's a great place to stop. Thank you so much for joining us today."},{"who":"Guest","en":"Thanks for having me. And good luck to everyone going to their first conference!"},{"who":"Host","en":"And that's it for this episode of Lab Coffee. See you next time!"}],"quiz":[{"q":"ゲストの初めての学会での失敗は？","a":"ポスターで最初の来訪者に話しかけられて固まり、アブストラクトを一語ずつ読み上げてしまった。"},{"q":"そこから学んだことは？","a":"30秒の短い説明（課題・やったこと・なぜ重要か）を自然に言えるよう準備しておく。"},{"q":"ポスターで最初に聞くと良い質問は？","a":"What do you work on? 相手の背景で説明を変えられ、自分も一息つける。"},{"q":"口頭発表の3つのアドバイスは？","a":"①短い文で1文1アイデア ②最初と最後を自動で言えるまで練習 ③実際のスライドとタイマーで練習（時間厳守）。"},{"q":"質問が聞き取れないときは？","a":"聞き返すか、If I understand correctly... と言い換えて確認する。考える時間ができ、聴衆にも親切。"},{"q":"内向的な人のネットワーキングのコツは？","a":"会いたい人の発表を聞いてその質問で話しかける／コーヒーの近くに立つ／グループに加わり、間ができたら自己紹介。"},{"q":"学会後のフォローは？","a":"1週間以内に短く具体的なメールを送る。LinkedInなどでつながる。"},{"q":"英語に不安がある人への最後のアドバイスは？","a":"参加者の多くは非ネイティブ。文法の完璧さより伝わることが大事。少しゆっくり、簡単な言葉で、笑顔で。"}],"vocab":[{"en":"froze","ja":"固まった"},{"en":"eyes glazing over","ja":"目がうつろになる（退屈して）"},{"en":"fade out","ja":"尻すぼみに終わる"},{"en":"cut you off","ja":"話をさえぎる"},{"en":"I'm stealing that","ja":"それ使わせてもらうね"},{"en":"wrap up","ja":"締めくくる"}],"file":"audio/E04_e04.mp3","dur":558}];

const speeds = [0.8, 1.0, 1.2, 1.5];
let speedIdx = store.get("speedIdx", 1);
let current = null;
let plist = [];  // 連続再生の順番（トラックID）
function playList(ids){ plist = ids.filter(id => byId[id]); if (plist.length){ current = null; playTrack(plist[0], plist); } }
function nextTrack(step){
  const i = plist.indexOf(current);
  if (i < 0 || !plist[i + step]) return false;
  current = null; playTrack(plist[i + step], plist); return true;
}
function playTrack(id, list){
  const t = byId[id]; if (!t) return;
  if (current === id){ audio.paused ? audio.play() : audio.pause(); return; }
  if (list) plist = list; else if (!plist.includes(id)) plist = [id];
  current = id;
  audio.src = t.file;
  audio.playbackRate = speeds[speedIdx];
  audio.play().catch(()=>{});
  $("#player").hidden = false;
  const pos = plist.indexOf(id);
  $("#pTitle").textContent = (plist.length > 1 ? `${pos + 1}/${plist.length} ` : "") + t.title;
  plays[id] = (plays[id] || 0) + 1; store.set("plays", plays);
  if ("mediaSession" in navigator){
    try { navigator.mediaSession.metadata = new MediaMetadata({title:t.title, artist:"学会英語ラボ · " + CAT[t.cat], album:t.accent}); } catch(e){}
    try {
      navigator.mediaSession.setActionHandler("seekbackward", () => { audio.currentTime -= 10; });
      navigator.mediaSession.setActionHandler("seekforward", () => { audio.currentTime += 10; });
      navigator.mediaSession.setActionHandler("play", () => audio.play());
      navigator.mediaSession.setActionHandler("pause", () => audio.pause());
      navigator.mediaSession.setActionHandler("nexttrack", () => nextTrack(1));
      navigator.mediaSession.setActionHandler("previoustrack", () => { if (audio.currentTime > 5 || !nextTrack(-1)) audio.currentTime = 0; });
    } catch(e){}
  }
  syncPlayButtons();
}
function syncPlayButtons(){
  $("#pPlay").innerHTML = audio.paused ? ICON_PLAY : ICON_PAUSE;
  document.querySelectorAll("[data-play]").forEach(b => {
    b.innerHTML = (b.dataset.play === current && !audio.paused) ? ICON_PAUSE : ICON_PLAY;
  });
}
audio.addEventListener("play", syncPlayButtons);
audio.addEventListener("pause", syncPlayButtons);
audio.addEventListener("timeupdate", () => {
  if (!audio.duration) return;
  $("#pSeek").value = audio.currentTime / audio.duration * 100;
  $("#pTime").textContent = fmt(audio.currentTime) + " / " + fmt(audio.duration);
});
audio.addEventListener("ended", () => { if (!nextTrack(1)) renderCurrent(); });
$("#pNext").onclick = () => nextTrack(1);
let wakeLock = null;
async function setWake(on){
  try {
    if (on && "wakeLock" in navigator){ wakeLock = await navigator.wakeLock.request("screen"); }
    else if (wakeLock){ await wakeLock.release(); wakeLock = null; }
  } catch(e){ wakeLock = null; }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && store.get("wake", false) && !audio.paused) setWake(true); });
audio.addEventListener("play", () => { if (store.get("wake", false)) setWake(true); });
audio.addEventListener("pause", () => setWake(false));
$("#pPlay").onclick = () => { if (current) audio.paused ? audio.play() : audio.pause(); };
$("#pBack").onclick = () => { audio.currentTime = Math.max(0, audio.currentTime - 10); };
$("#pSeek").oninput = e => { if (audio.duration) audio.currentTime = e.target.value / 100 * audio.duration; };
function setSpeedLabel(){ $("#pSpeed").textContent = speeds[speedIdx].toFixed(1) + "×"; }
$("#pSpeed").onclick = () => { speedIdx = (speedIdx + 1) % speeds.length; audio.playbackRate = speeds[speedIdx]; store.set("speedIdx", speedIdx); setSpeedLabel(); };
setSpeedLabel();
document.addEventListener("click", e => {

  if (b){ e.stopPropagation(); const box = b.closest("[data-list]"); playTrack(b.dataset.play, box ? box.dataset.list.split(",") : null); return; }

/* ---------- flash cards ---------- */
const DECKS = [];
DATA.filter(t => t.cat === "drill").forEach(t => {
  let d = DECKS.find(x => x.id === t.deck);
  if (!d){ d = {id:t.deck, title:t.title.replace(/ \d+$/,""), items:[]}; DECKS.push(d); }
  t.items.forEach((it, i) => d.items.push({...it, key: t.id + ":" + i}));
});
DATA.filter(t => t.cat === "qa").forEach(t => {
  DECKS.push({id:t.id, title:t.title.replace("質疑ドリル","質疑"), items:t.items.map((it,i) => ({ja:it.hint, en:it.a, q:it.q, key:t.id+":"+i}))});
});
let deckId = store.get("deck", DECKS[0].id), mode = store.get("mode", "je"), cardIdx = 0, revealed = false, accentPref = store.get("accent", "en-US");
let queue = [];
function buildQueue(){
  const d = DECKS.find(x => x.id === deckId) || DECKS[0];
  const unk = d.items.filter(it => !known[it.key]);
  queue = (unk.length ? unk : d.items).slice().sort(() => Math.random() - .5);
  cardIdx = 0; revealed = false;
}
function speak(text){
  if (!("speechSynthesis" in window)) return false;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = accentPref; u.rate = 0.95;
  const v = speechSynthesis.getVoices().find(v => v.lang.replace("_","-") === accentPref);
  if (v) u.voice = v;
  speechSynthesis.speak(u);
  return true;
}
function renderCards(){
  const d = DECKS.find(x => x.id === deckId) || DECKS[0];
  if (!queue.length) buildQueue();
  const it = queue[cardIdx % queue.length];
  const kn = d.items.filter(x => known[x.key]).length;
  const front = mode === "je"
    ? `<div class="q">${esc(it.q ? it.q : it.ja)}</div>${it.q ? `<div class="small muted">ヒント：${esc(it.ja)}</div>` : ""}${it.disp ? `<div class="disp mono" style="color:var(--accent)">${esc(it.disp)}</div>` : ""}`
    : `<div class="q enq">（音声を聞いて意味を言う）</div>`;
  const back = mode === "je"
    ? `<div class="a">${esc(it.en)}</div>`
    : `<div class="a">${esc(it.en)}</div><div class="a jpa">${esc(it.ja)}</div>`;
  $("#view-cards").innerHTML = `
    <div class="stack" style="gap:6px"><h2>フレーズカード</h2><p class="small muted">「言えた」にしたカードは次から出にくくなります。全部言えたら全カードからランダムに出ます。</p></div>
    <div class="chips">${DECKS.map(x => `<button class="chip" data-deck="${x.id}" aria-pressed="${x.id===deckId}">${esc(x.title)}</button>`).join("")}</div>
    <div class="row" style="justify-content:space-between">
      <div class="toggle-row"><button class="toggle" data-mode="je" aria-pressed="${mode==="je"}">日→英（話す）</button><button class="toggle" data-mode="ej" aria-pressed="${mode==="ej"}">英→日（聞く）</button></div>
      <label class="small row" for="accentSel">発音 <select id="accentSel">${[["en-US","米"],["en-GB","英"],["en-IN","印"],["en-AU","豪"]].map(([k,l]) => `<option value="${k}" ${k===accentPref?"selected":""}>${l}</option>`).join("")}</select></label>
    </div>
    <div class="card" aria-live="polite">${front}${revealed ? back : ""}</div>
    ${revealed
      ? `<div class="btn-row"><button class="btn" id="again">もう一度</button><button class="btn good" id="gotIt">言えた</button></div>`
      : `<div class="btn-row"><button class="btn" id="say">発音を聞く</button><button class="btn primary" id="reveal">答えを見る</button></div>`}
    <div class="stack" style="gap:4px"><div class="row small muted" style="justify-content:space-between"><span>${esc(d.title)}</span><span class="mono">${kn} / ${d.items.length} 言えた</span></div>
      <div class="meter"><i style="width:${kn / d.items.length * 100}%"></i></div></div>
    <p class="small muted" id="ttsNote"></p>`;
  document.querySelectorAll("[data-deck]").forEach(b => b.onclick = () => { deckId = b.dataset.deck; store.set("deck", deckId); buildQueue(); renderCards(); });
  document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { mode = b.dataset.mode; store.set("mode", mode); revealed = false; renderCards(); });
  $("#accentSel").onchange = e => { accentPref = e.target.value; store.set("accent", accentPref); };
  const sayBtn = $("#say");
  if (sayBtn) sayBtn.onclick = () => { if (!speak(it.en)) $("#ttsNote").textContent = "この端末では読み上げが使えません。音声タブのMP3を使ってください。"; };
  const rv = $("#reveal"); if (rv) rv.onclick = () => { revealed = true; renderCards(); if (mode === "je") speak(it.en); };
  const ag = $("#again"); if (ag) ag.onclick = () => { cardIdx++; revealed = false; renderCards(); };
  const gi = $("#gotIt"); if (gi) gi.onclick = () => { known[it.key] = 1; store.set("known", known); cardIdx++; revealed = false; renderCards(); };
  if (mode === "ej" && !revealed) setTimeout(() => speak(it.en), 150);
}

      }).join("")}</div></div>`).join("")}
    <div class="panel small"><h3>開始日</h3><p class="muted">週は開始日から自動で数えます。</p>
      <div class="row"><input type="date" id="startInput" value="${startDate}" style="font:inherit;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)"><button class="btn" id="saveStart">変更</button></div></div>`;
  document.querySelectorAll("[data-week]").forEach(b => b.onclick = () => { week = +b.dataset.week; showTab("today"); renderAll(); });
  $("#saveStart").onclick = () => { const v = $("#startInput").value; if (v){ startDate = v; store.set("start", v); week = autoWeek(); renderAll(); } };
}

/* ---------- kit ---------- */
const TOPIC = "[my research topic, e.g. dark-field optical inspection of sub-30 nm particles on silicon wafers]";

Play this visitor type: [an expert in the same field / a researcher from a different field / an engineer from an inspection equipment company].

[paste script]`},
  {t:"6. 模擬学会（通し）", d:"P4の総仕上げ。", p:`Run a full mock conference session with me, in English, by voice:

  {t:"7. 聞き取れなかった発表の確認", d:"本物の学会動画を見たあとに。", p:`I just watched a conference talk titled "[title]". Here is my summary in English: [your summary]
Ask me 3 follow-up questions about the talk to check my understanding, one at a time. Then tell me in Japanese which parts of my summary seem uncertain, and suggest what to listen for if I watch it again.`},

function renderKit(){

        <p><b>1. Title</b> — Thank you, chair. Today I'd like to talk about [title]. This is joint work with [共同研究者].</p>
        <p><b>2. Outline</b> — Here is the outline. I'll start with the background, then explain our method, show the results, and conclude.</p>
        <p><b>3. Background</b> — As you know, [大きな流れ]. However, [課題]. (1〜2枚)</p>

        <p><b>5. Principle / Design</b> — Let me explain the basic principle. This slide shows [図]. The key point is [要点].</p>
        <p><b>6. Setup / Fabrication</b> — This is our experimental setup. Light from [光源] is [経路]...</p>
        <p><b>7. Results</b> — Now, let's look at the results. The figure on the left shows... As you can see... Compared with [従来], [改善].</p>
        <p><b>8. Discussion</b> — We believe this is due to [理由]. However, there are some limitations...</p>
        <p><b>9. Summary</b> — To summarize, we [やったこと1], [2], [3]. In future work, we plan to [今後].</p>

      <p class="small muted">各質問に「結論の一言 → 根拠1つ → 補足」で英語の答えを作り、録音します。答えられない質問は「難しい質問・聞き返し」デッキの返し方を使います。</p></div>

    <div class="panel" id="k-ai"><h3>AIプロンプト</h3>
      <p class="small muted">Claudeアプリの音声モードなどに貼って使います。[ ] の中を自分の研究に置き換えてください。</p>

        <li><a href="https://www.youtube.com/results?search_query=Optica+webinar+integrated+photonics" target="_blank" rel="noopener">Optica の webinar（集積フォトニクス）</a></li>
        <li><a href="https://www.youtube.com/results?search_query=optical+coherence+tomography+industrial+inspection+talk" target="_blank" rel="noopener">産業用 OCT の講演</a></li>
      </ul>
      <p class="small muted">質疑応答の部分が入っている動画が特に役立ちます。1.0倍で聞き取れたら1.2倍にします。</p></div>`;
  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => {
    const txt = PROMPTS[+b.dataset.copy].p;
    const done = () => { b.textContent = "コピーしました"; setTimeout(() => b.textContent = "コピー", 1500); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents($("#prompt" + b.dataset.copy)); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "選択しました"; };
    try { navigator.clipboard.writeText(txt).then(done, fallback); } catch(e){ fallback(); }

/* ---------- offline (service worker cache) ---------- */
const AUDIO_CACHE = "gel-audio-v1";
async function cachedCount(){
  if (!("caches" in window)) return -1;
  try { const c = await caches.open(AUDIO_CACHE); return (await c.keys()).length; } catch(e){ return -1; }
}
async function offlineUI(){
  const st = $("#offStatus"), bt = $("#offSave"); if (!st) return;
  const n = await cachedCount();
  if (n < 0 || !("serviceWorker" in navigator)){ st.textContent = "この表示方法では保存できません"; bt.hidden = true; return; }
  st.textContent = `${n} / ${DATA.length} 本を保存済み`;
  bt.textContent = n >= DATA.length ? "保存済み（更新）" : "全音声を保存";
  bt.onclick = async () => {
    bt.disabled = true;
    const c = await caches.open(AUDIO_CACHE);
    let done = 0, fail = 0;
    for (const t of DATA){
      try {
        if (!(await c.match(t.file))){ const r = await fetch(t.file, {cache:"no-store"}); if (!r.ok) throw 0; await c.put(t.file, r); }
      } catch(e){ fail++; }
      done++; st.textContent = `保存中 ${done} / ${DATA.length}`;
    }
    st.textContent = fail ? `${fail}本失敗しました。電波の良い場所でもう一度押してください` : `${DATA.length} / ${DATA.length} 本を保存済み`;
    bt.disabled = false; bt.textContent = "保存済み（更新）";
  };
}
if ("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(() => {});
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}
}

  tab = t;
  document.querySelectorAll("section.view").forEach(s => s.hidden = s.id !== "view-" + t);
  document.querySelectorAll("nav.tabs button").forEach(b => {
    if (b.dataset.tab === t) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });

}

function renderCurrent(){

}

renderAll();
