<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>学会英語ラボ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="学会英語ラボ">
<meta name="theme-color" content="#0B7285">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
/* Layout: phone-first single column; sticky week header, fixed mini-player + bottom tab bar. Spectral accent = 1550 nm "IR" teal, warm 532 nm green only for done states. */
:root{
  --bg:#F3F6F7; --surface:#FFFFFF; --line:#D9E1E5; --fg:#13212B; --muted:#5B6B76;
  --accent:#0B7285; --accent-ink:#FFFFFF; --accent-soft:#DDF0F3; --done:#2F7D32; --warn:#B45309;
  --display:"Zen Kaku Gothic New","Noto Sans JP",system-ui,sans-serif;
  --body:"Noto Sans JP",system-ui,sans-serif;
  --en:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1519; --surface:#152027; --line:#26343D; --fg:#E4ECEF; --muted:#93A4AE;
  --accent:#4FC3D4; --accent-ink:#06242A; --accent-soft:#16333A; --done:#7BC67E; --warn:#F0A44B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1519; --surface:#152027; --line:#26343D; --fg:#E4ECEF; --muted:#93A4AE;
  --accent:#4FC3D4; --accent-ink:#06242A; --accent-soft:#16333A; --done:#7BC67E; --warn:#F0A44B; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.65 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 170px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
main{max-width:680px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:1.5rem;font-weight:900}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.en{font-family:var(--en)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line);margin-bottom:16px}
header.top .row{justify-content:space-between;flex-wrap:nowrap}
.weeknav{display:flex;align-items:center;gap:4px}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px}
.spectrum{height:3px;border-radius:2px;margin-top:10px;background:linear-gradient(90deg,var(--accent) 0%,var(--accent) var(--p,0%),var(--line) var(--p,0%))}

section.view{display:flex;flex-direction:column;gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.phase-tag{display:inline-block;font-family:var(--mono);font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:500}

/* track rows */
.tracks{display:flex;flex-direction:column}
.track{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.tracks .track:first-child{border-top:0}
.play{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;border:0}
.play svg{width:16px;height:16px}
.track .t-main{min-width:0}
.track .t-title{font-weight:500;line-height:1.35}
.track .t-meta{font-size:.78rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.code{font-family:var(--mono);font-size:.75rem;color:var(--accent)}
.count{font-family:var(--mono);font-size:.75rem;color:var(--muted);text-align:right;white-space:nowrap}
.count.has{color:var(--done)}

/* tasks */
.task{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--done)}
.task label{cursor:pointer}
.task.done label{color:var(--muted);text-decoration:line-through}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* detail */
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--accent);padding:0;font-weight:500}
.big-play{display:flex;gap:12px;align-items:center}
.big-play .play{width:56px;height:56px}
.line{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.line:first-child{border-top:0}
.line .jp{font-size:.88rem;color:var(--muted)}
.line .en{font-size:1rem}
.line .disp{font-family:var(--mono);color:var(--accent)}
.hide-ja .jp{display:none}
.hide-en .en,.hide-en .disp{filter:blur(6px);transition:filter .2s}
.hide-en .line:hover .en,.hide-en .line:focus-within .en{filter:none}
.para{font-family:var(--en);font-size:1rem;line-height:1.7}
.who{font-family:var(--mono);font-size:.72rem;color:var(--accent);font-weight:500}
details{border-top:1px solid var(--line);padding:8px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:500}
details p{margin-top:6px;color:var(--muted)}
.toggle-row{display:flex;gap:6px;flex-wrap:wrap}
.toggle{padding:5px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:.8rem}
.toggle[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* flash cards */
.card{min-height:220px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 18px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.card .q{font-family:var(--display);font-size:1.25rem;font-weight:700;line-height:1.5}
.card .q.enq{font-family:var(--en);font-weight:600}
.card .a{font-family:var(--en);font-size:1.1rem;line-height:1.5;color:var(--accent)}
.card .a.jpa{font-family:var(--body);color:var(--fg)}
.btn{padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.good{background:var(--done);color:var(--bg);border-color:var(--done)}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--done)}

/* plan */
.week{display:grid;grid-template-columns:48px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.week .wn{font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.week.current .wn{color:var(--accent);font-weight:500}
.week .wf{font-weight:500}
.ck{color:var(--warn);font-size:.78rem;font-weight:500}

/* kit */
pre.prompt{white-space:pre-wrap;font-family:var(--en);font-size:.85rem;line-height:1.55;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;margin:0;max-height:260px;overflow:auto}
.tmpl{font-family:var(--en);font-size:.92rem;line-height:1.7}
.tmpl b{color:var(--accent);font-weight:600}
.tmpl .note{font-family:var(--body);font-size:.8rem;color:var(--muted)}
ul.plain{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
a{color:var(--accent)}

/* mini player + nav */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.player{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;max-width:680px;margin:0 auto;
  padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.player .p-title{font-size:.85rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .p-time{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.seek{width:100%;height:4px;accent-color:var(--accent);margin:2px 0 0}
.p-ctl{display:flex;gap:4px;align-items:center}
.spd{font-family:var(--mono);font-size:.75rem;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);min-width:48px}
nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);max-width:680px;margin:0 auto;
  padding:0 env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
nav.tabs button{background:none;border:0;padding:8px 0 10px;font-size:.72rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.qbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn.sm{padding:6px 12px;font-size:.85rem}
.progress{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<main>
  <header class="top">
    <div class="row">
      <div class="stack" style="gap:2px;min-width:0">
        <span class="eyebrow" id="hdrEyebrow">WEEK 1 / 24</span>
        <h1 id="hdrTitle">学会英語ラボ</h1>
      </div>
      <div class="weeknav">
        <button class="icon-btn" id="prevWeek" aria-label="前の週"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="icon-btn" id="nextWeek" aria-label="次の週"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
    </div>
    <div class="spectrum" id="spectrum"></div>
  </header>

  <section class="view" id="view-today"></section>
  <section class="view" id="view-audio" hidden></section>
  <section class="view" id="view-cards" hidden></section>
  <section class="view" id="view-plan" hidden></section>
  <section class="view" id="view-kit" hidden></section>
</main>

<div class="dock">
  <div class="player" id="player" hidden>
    <button class="play" id="pPlay" aria-label="再生/一時停止"></button>
    <div style="min-width:0">
      <div class="p-title" id="pTitle"></div>
      <input type="range" class="seek" id="pSeek" min="0" max="100" value="0" step="0.1" aria-label="再生位置">
      <div class="p-time" id="pTime">0:00 / 0:00</div>
    </div>
    <div class="p-ctl">
      <button class="icon-btn" id="pBack" aria-label="10秒戻る"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></svg></button>
      <button class="icon-btn" id="pNext" aria-label="次のトラック"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 5v14l10-7zM16 5h3v14h-3z"/></svg></button>
      <button class="spd" id="pSpeed" aria-label="再生速度">1.0×</button>
    </div>
  </div>
  <nav class="tabs" aria-label="メニュー">
    <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>今日</button>
    <button data-tab="audio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1"/><rect x="17" y="14" width="4" height="6" rx="1"/></svg>音声</button>
    <button data-tab="cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="6" width="14" height="12" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v10"/></svg>カード</button>
    <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>計画</button>
    <button data-tab="kit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7h14v12H5z"/><path d="M9 7V5h6v2M5 12h14"/></svg>キット</button>
  </nav>
</div>
<audio id="audio" preload="none"></audio>

window.DATA = [{"id":"sign1","cat":"drill","deck":"sign","title":"発表のつなぎ表現 (Signposting) 1","goal":"②発表","voice":"en-US-AndrewNeural","accent":"アメリカ","items":[{"ja":"本日は、シリコンフォトニクスを用いた光送受信器についてお話しします。","en":"Today, I'd like to talk about an optical transceiver based on silicon photonics."},{"ja":"まず、研究の背景を簡単に説明します。","en":"First, let me briefly explain the background of this work."},{"ja":"本発表の構成は次の通りです。","en":"Here is the outline of my talk."},{"ja":"動機から始めて、次に提案手法、最後に実験結果をお見せします。","en":"I'll start with the motivation, then describe our proposed method, and finally show the experimental results."},{"ja":"ご存知の通り、データセンターのトラフィックは急増しています。","en":"As you know, data center traffic is growing rapidly."},{"ja":"ここで重要な課題は消費電力です。","en":"The key challenge here is power consumption."},{"ja":"この問題に対処するため、私たちは新しい構造を提案します。","en":"To address this problem, we propose a new structure."},{"ja":"本研究の主な貢献は三つあります。","en":"There are three main contributions of this work."},{"ja":"では、提案手法に移ります。","en":"Now, let's move on to the proposed method."},{"ja":"このスライドは装置の概略図を示しています。","en":"This slide shows a schematic of the setup."},{"ja":"詳細に入る前に、基本原理を確認しておきます。","en":"Before going into the details, let me review the basic principle."},{"ja":"ここがポイントです。","en":"This is the key point."},{"ja":"言い換えると、損失はほとんど波長に依存しません。","en":"In other words, the loss is almost independent of wavelength."},{"ja":"先ほど述べたように、結合効率が非常に重要です。","en":"As I mentioned earlier, the coupling efficiency is critical."},{"ja":"これについては後ほど詳しく説明します。","en":"I'll come back to this point later."},{"ja":"時間の都合上、詳細は省略します。","en":"Due to time constraints, I'll skip the details."},{"ja":"詳細は論文をご参照ください。","en":"Please refer to our paper for more details."},{"ja":"次に、実験結果をお見せします。","en":"Next, I'll show you the experimental results."},{"ja":"左の図は測定されたスペクトルを示しています。","en":"The figure on the left shows the measured spectrum."},{"ja":"ご覧の通り、シミュレーションと実験はよく一致しています。","en":"As you can see, the simulation agrees well with the experiment."}],"file":"audio/A01_sign1.mp3","dur":440},{"id":"sign2","cat":"drill","deck":"sign","title":"発表のつなぎ表現 (Signposting) 2","goal":"②発表","voice":"en-GB-SoniaNeural","accent":"イギリス","items":[{"ja":"これは予想よりかなり良い結果でした。","en":"This was much better than we expected."},{"ja":"興味深いことに、共振は長波長側にシフトしました。","en":"Interestingly, the resonance shifted to a longer wavelength."},{"ja":"これは熱光学効果によるものと考えられます。","en":"We believe this is due to the thermo-optic effect."},{"ja":"従来手法と比較すると、感度が10倍向上しています。","en":"Compared with the conventional method, the sensitivity is improved by a factor of ten."},{"ja":"この結果は、提案手法の有効性を示しています。","en":"This result demonstrates the effectiveness of the proposed method."},{"ja":"ただし、いくつかの制限があります。","en":"However, there are some limitations."},{"ja":"一つ目は、作製誤差に敏感であることです。","en":"The first one is that it is sensitive to fabrication errors."},{"ja":"ここで強調したいのは、このデバイスが完全にCMOS互換であることです。","en":"What I want to emphasize here is that the device is fully CMOS compatible."},{"ja":"一見すると、これは直感に反するように見えるかもしれません。","en":"At first glance, this may look counterintuitive."},{"ja":"次のスライドでその理由を説明します。","en":"I'll explain why on the next slide."},{"ja":"簡単に言えば、試料に触れずに欠陥を測定できます。","en":"Simply put, we can measure defects without touching the sample."},{"ja":"この部分を拡大してみましょう。","en":"Let's zoom in on this part."},{"ja":"少し話を戻します。","en":"Let me go back for a moment."},{"ja":"このスライドを順に説明させてください。","en":"Let me walk you through this slide."},{"ja":"まとめに入ります。","en":"Let me summarize."},{"ja":"まとめると、私たちは低損失な光結合器を実証しました。","en":"To summarize, we demonstrated a low-loss optical coupler."},{"ja":"今後は、集積化と高速動作に取り組む予定です。","en":"In future work, we plan to work on integration and high-speed operation."},{"ja":"最後に、共同研究者と資金提供元に感謝します。","en":"Finally, I'd like to thank my collaborators and our funding agencies."},{"ja":"ご清聴ありがとうございました。","en":"Thank you for your attention."},{"ja":"ご質問があればお受けします。","en":"I'd be happy to take any questions."}],"file":"audio/A02_sign2.mp3","dur":460},{"id":"fig1","cat":"drill","deck":"fig","tit ":"45度入射","en":"forty-five-degree incidence","disp":"45°"},{"ja":"5ミリ角のチップ","en":"a five-by-five-millimeter chip","disp":"5 mm × 5 mm"},{"ja":"図3のb","en":"Figure three b","disp":"Fig. 3(b)"},{"ja":"式2","en":"Equation two","disp":"Eq. (2)"},{"ja":"xの2乗プラス yの2乗","en":"x squared plus y squared","disp":"x² + y²"},{"ja":"約2倍大きい","en":"roughly twice as large","disp":"~2×"}],"file":"audio/A06_num2.mp3","dur":372},{"id":"cpo1","cat":"drill","deck":"cpo","title":"光電融合・シリコンフォトニクス表現 1","goal":"②発表 ①聞く","voice":"en-US-BrianNeural","accent":"アメリカ","items":[{"ja":"光電融合は、電子回路と光回路を一つのパッケージに統合する技術です。","en":"Optoelectronic integration combines electronic and photonic circuits in a single package."},{"ja":"産業界では、コパッケージド・オプティクス、略してCPOと呼ばれることが多いです。","en":"In industry, this is often called co-packaged optics, or CPO."},{"ja":"電気配線は距離が長くなると、損失と消費電力が増えます。","en":"Electrical interconnects suffer from higher loss and power consumption as the distance increases."},{"ja":"光配線は帯域密度が高く、消費電力が低いです。","en":"Optical interconnects offer high bandwidth density and low power consumption."},{"ja":"スイッチASICのすぐ隣に光エンジンを配置します。","en":"We place the optical engine right next to the switch ASIC."},{"ja":"シリコン導波路は強い光閉じ込めを持っています。","en":"Silicon waveguides have strong optical confinement."},{"ja":"そのため、曲げ半径を数マイクロメートルまで小さくできます。","en":"This allows bending radii of just a few micrometers."},{"ja":"ファイバとチップの結合損失が大きな課題です。","en":"Fiber-to-chip coupling loss is a major challenge."},{"ja":"スポットサイズ変換器でモードを整合させます。","en":"We use a spot-size converter to match the modes."},{"ja":"グレーティングカプラは偏波依存性があります。","en":"Grating couplers are polarization dependent."},{"ja":"シリコンは間接遷移型なので、効率よく発光できません。","en":"Silicon has an indirect bandgap, so it cannot emit light efficiently."},{"ja":"そのため、III-V族レーザーを異種集積します。","en":"Therefore, we heterogeneously integrate three-five lasers."},{"ja":"マッハツェンダー変調器はキャリア空乏効果を利用しています。","en":"The Mach-Zehnder modulator uses the carrier depletion effect."},{"ja":"リング変調器は小型ですが、温度に敏感です。","en":"Ring modulators are compact but sensitive to temperature."},{"ja":"ヒーターで共振波長を調整します。","en":"We tune the resonance wavelength with a heater."},{"ja":"ゲルマニウム受光器は高い応答度を示しました。","en":"The germanium photodetector showed high responsivity."},{"ja":"応答度は1.0アンペア毎ワットでした。","en":"The responsivity was one point zero amperes per watt."},{"ja":"暗電流は10ナノアンペア以下です。","en":"The dark current is below ten nanoamperes."},{"ja":"波長分割多重により、チャネル数を増やせます。","en":"Wavelength division multiplexing allows us to increase the number of channels."},{"ja":"PAM4変調で、1レーンあたり200ギガビット毎秒を達成しました。","en":"We achieved two hundred gigabits per second per lane using PAM4 modulation."}],"file":"audio/A07_cpo1.mp3","dur":525},{"id":"cpo2","cat":"drill","deck":"cpo","title":"光電融合・シリコンフォトニクス表現 2","goal":"②発表 ①聞く","voice":"en-IE-EmilyNeural","accent":"アイルランド","items":[{"ja":"ビットあたりのエネルギーが重要な性能指標です。","en":"Energy per bit is an important figure of merit."},{"ja":"熱管理はパッケージングにおける大きな課題です。","en":"Thermal management is a major challenge in packaging."},{"ja":"CMOS互換プロセスで作製しました。","en":"The device was fabricated in a CMOS-compatible process."},{"ja":"ファウンドリのPDKを使って設計しました。","en":"We designed it using the foundry's PDK."},{"ja":"作製ばらつきが性能に影響します。","en":"Fabrication variations affect the performance."},{"ja":"ウェハレベルで自動測定を行いました。","en":"We performed automated measurements at the wafer level."},{"ja":"薄膜ニオブ酸リチウムは高速変調に適しています。","en":"Thin-film lithium niobate is well suited for high-speed modulation."},{"ja":"損失の主な原因は、側壁の荒れによる散乱です。","en":"The main source of loss is scattering due to sidewall roughness."},{"ja":"外部共振器レーザーを光源として使いました。","en":"We used an external cavity laser as the light source."},{"ja":"偏波コントローラで入力をTEモードに合わせました。","en":"We aligned the input to the TE mode with a polarization controller."},{"ja":"光スペクトラムアナライザで透過スペクトルを測定しました。","en":"We measured the transmission spectrum with an optical spectrum analyzer."},{"ja":"低遅延は光電融合の大きな利点です。","en":"Low latency is a major advantage of optoelectronic integration."},{"ja":"将来の目標はラックスケールでの光接続です。","en":"Our future goal is optical connectivity at the rack scale."},{"ja":"光源を外部に置く方式は、信頼性の面で有利です。","en":"Using an external laser source is advantageous in terms of reliability."},{"ja":"歩留まりの向上が量産化の鍵です。","en":"Improving yield is the key to mass production."},{"ja":"帯域密度は、ミリメートルあたりのテラビット毎秒で表されます。","en":"Bandwidth density is expressed in terabits per second per millimeter."},{"ja":"光電変換のオーバーヘッドを減らすことが重要です。","en":"It is important to reduce the overhead of optical-to-electrical conversion."},{"ja":"このチップは8チャネルの送信器を集積しています。","en":"This chip integrates an eight-channel transmitter."},{"ja":"光の位相を電気的に制御します。","en":"We control the phase of light electrically."},{"ja":"リタイマーを省くことで、消費電力を大幅に削減できます。","en":"By eliminating the retimer, we can significantly reduce power consumption."}],"file":"audio/A08_cpo2.mp3","dur":551},{"id":"insp1","cat":"drill","deck":"insp","title":"光学検査・計測の表現 1","goal":"②発表 ①聞く","voice":"en-GB-ThomasNeural","accent":"イギリス","items":[{"ja":"光学検査は非破壊で高速なのが利点です。","en":"Optical inspection has the advantage of being non-destructive and fast."},{"ja":"暗視野照明では、欠陥からの散乱光だけを検出します。","en":"In dark-field illumination, we detect only the light scattered by defects."},{"ja":"明視野では、反射率の違いでパターンを観察します。","en":"In bright-field imaging, we observe patterns through differences in reflectance."},{"ja":"回折限界より小さい欠陥を検出する必要があります。","en":"We need to detect defects smaller than the diffraction limit."},{"ja":"分解能は波長と開口数で決まります。","en":"The resolution is determined by the wavelength and the numerical aperture."},{"ja":"波長を短くすると分解能が向上します。","en":"Using a shorter wavelength improves the resolution."},{"ja":"偏光を利用して背景散乱を抑制しました。","en":"We used polarization to suppress background scattering."},{"ja":"信号対雑音比が5倍向上しました。","en":"The signal-to-noise ratio improved fivefold."},{"ja":"スループットと感度の間にはトレードオフがあります。","en":"There is a trade-off between throughput and sensitivity."},{"ja":"1時間あたり100枚のウェハを検査できます。","en":"The system can inspect one hundred wafers per hour."},{"ja":"誤検出率を1パーセント未満に抑えました。","en":"We kept the fals a":"また明日。","en":"See you tomorrow."},{"ja":"後でメールします。","en":"I'll send you an email later."},{"ja":"来年の学会でまた会いましょう。","en":"Hope to see you at next year's conference."}],"file":"audio/A22_small2.mp3","dur":330},{"id":"t01","cat":"talk","title":"Co-packaged optics for AI clusters","ja":"AIクラスタ向けコパッケージド・オプティクス","voice":"en-US-AndrewNeural","accent":"アメリカ","body":["Good morning, everyone. Thank you for coming. Today I'd like to talk about co-packaged optics for large-scale AI clusters.","Let me start with the motivation. Training a modern AI model requires thousands of accelerators that constantly exchange data. As the switch bandwidth doubles roughly every two years, the electrical link between the switch chip and the front-panel pluggable module becomes a bottleneck. At two hundred gigabits per second per lane, the electrical channel loss is so high that we need power-hungry retimers and DSPs. In some systems, the optics and the electrical interface together consume more than a quarter of the total switch power.","To address this problem, co-packaged optics moves the optical engine from the front panel into the same package as the switch ASIC. The electrical trace becomes only a few millimeters long, so we can use a much simpler, lower-power interface.","Here is the outline of our approach. Our optical engine is based on silicon photonics. Each engine has eight lanes, and each lane runs at two hundred gigabits per second with PAM4 modulation, so one engine provides one point six terabits per second. We use micro-ring modulators because they are compact, but as you know, rings are very sensitive to temperature. So we implemented a closed-loop thermal control that locks each ring to its laser wavelength.","Now, let's look at the results. This figure shows the eye diagrams at eighty degrees Celsius. As you can see, all eight lanes are clearly open, and the bit error rate is below the KP4 FEC threshold. The total energy consumption, including the laser, is about five picojoules per bit, which is roughly forty percent lower than a conventional pluggable module.","However, there are still some challenges. The first one is serviceability: if a laser fails, you don't want to replace the whole switch. That's why we use an external laser source located on the front panel. The second challenge is fiber attach at high volume, which I'll come back to in the next talk in this session.","To summarize, we demonstrated a one point six terabit per second co-packaged optical engine with five picojoules per bit. Thank you for your attention. I'd be happy to take any questions."],"qa":[{"q":"Thank you for the nice talk. How much power does the thermal control for the rings consume?","a":"Good question. It's around ten percent of the total power at the moment. We think we can reduce it by improving the thermal isolation around each ring.","qaccent":"イギリス"},{"q":"Did you evaluate the long-term reliability of the external laser?","a":"Not yet, to be honest. We have run it for about one thousand hours without degradation, but a full reliability test is part of our future work.","qaccent":"インド"}],"quiz":[{"q":"なぜ電気配線がボトルネックになるのか？","a":"200 Gb/s/laneでは電気チャネルの損失が大きく、電力を食うリタイマーやDSPが必要になるため。"},{"q":"光エンジン1個の総容量とレーン構成は？","a":"8レーン × 200 Gb/s（PAM4）= 1.6 Tb/s。"},{"q":"リング変調器の課題と対策は？","a":"温度に非常に敏感。閉ループ熱制御で各リングをレーザー波長にロックした。"},{"q":"消費電力の結果は？","a":"レーザー込みで約5 pJ/bit。従来のプラガブルより約40%低い。"},{"q":"外部光源を使う理由は？","a":"保守性。レーザーが故障してもスイッチ全体を交換しなくて済む。"}],"vocab":[{"en":"accelerator","ja":"アクセラレータ（GPU等）"},{"en":"front-panel pluggable","ja":"前面挿抜型モジュール"},{"en":"retimer","ja":"リタイマー"},{"en":"serviceability","ja":"保守性"},{"en":"fiber attach","ja":"ファイバ接続（実装）"}],"file":"audio/B01_t01.mp3","dur":198},{"id":"t02","cat":"talk","title":"Thin-film lithium niobate modulators","ja":"薄膜ニオブ酸リチウム変調器","voice":"en-GB-RyanNeural","accent":"イギリス","body":["Thank you for the introduction. In this talk, I'll present our recent work on thin-film lithium niobate modulators with a very low drive voltage.","First, some background. Lithium niobate has been the workhorse of optical modulation for decades because of its strong Pockels effect. The problem with conventional bulk devices is that the optical mode is weakly confined, so the electrodes must be far apart and the device must be several centimeters long. Thin-film lithium niobate, or TFLN, changes this picture completely. Because the film is only about six hundred nanometers thick, the mode is tightly confined, and we can place the electrodes much closer to the waveguide.","Our key idea is to combine a slightly modified electrode geometry with a low-loss etching process. On this slide you can see the cross section. The waveguide is a rib structure with an etch depth of about three hundred nanometers, and the gap between the electrodes is five micrometers.","Let me walk you through the results. The half-wave voltage, V pi, is one point eight volts for a two-centimeter-long device, which corresponds to a V pi L of about three point six volt centimeters. The propagation loss, measured using ring resonators on the same chip, is zero point two dB per centimeter. And the electro-optic bandwidth exceeds one hundred gigahertz, as shown in this S21 plot.","Interestingly, we observed a slow drift of the bias point, which is a well-known issue in lithium niobate. We believe it's caused by charge accumulation at the interface with the oxide cladding. By changing the cladding deposition conditions, we reduced the drift by roughly one order of magnitude.","In summary, our modulator combines a low drive voltage with a bandwidth of over one hundred gigahertz, which makes it attractive for driver-less transmitters. Thank you very much."],"qa":[{"q":"Could you elaborate a bit more on the bias drift? Over what time scale did you measure it?","a":"Sure. We measured it over twenty-four hours at room temperature. With the original cladding, the bias drifted by about half of V pi, and with the new process it was below five percent.","qaccent":"アメリカ"},{"q":"How do you couple light into the chip, and what is the coupling loss?","a":"We use an edge coupler with a bilayer taper. The coupling loss is around one point five dB per facet. We're working on bringing it below one dB.","qaccent":"中国語なまり"}],"quiz":[{"q":"従来のバルクLN変調器の問題点は？","a":"光閉じ込めが弱く、電極間隔を広く・素子長を数cmにする必要がある。"},{"q":"VπとVπLの値は？","a":"2 cm素子でVπ = 1.8 V、VπL ≈ 3.6 V·cm。"},{"q":"伝搬損失はどう測ったか？","a":"同一チップ上のリング共振器で測定し、0.2 dB/cm。"},{"q":"バイアスドリフトの原因と対策は？","a":"酸化膜クラッドとの界面での電荷蓄積と推定。クラッドの成膜条件を変えて約1桁低減。"}],"vocab":[{"en":"workhorse","ja":"主力、定番"},{"en":"Pockels effect","ja":"ポッケルス効果"},{"en":"rib waveguide","ja":"リブ導波路"},{"en":"bias drift","ja":"バイアスドリフト"},{"en":"driver-less","ja":"ドライバ不要の"}],"file":"audio/B02_t02.mp3","dur":187},{"id":"t03","cat":"talk","title":"Dark-field inspection of sub-30 nm particles","ja":"30 nm以下の微粒子の暗視野検査","voice":"en-IN-PrabhatNeural","accent":"インド","body":["Good afternoon. My name is Raj, and I'm going to talk about dark-field optical inspection for particles smaller than thirty nanometers on bare silicon wafers.","As device dimensions shrink, the size of killer defects also shrinks. The difficulty is that, for particles much smaller than the wavelength, the scattered intensity scales with the sixth power of the diameter. So if the particle size is reduced by half, the signal drops by a factor of sixty-four. At the same time, the background scattering from the wafer surface, which we call haze, stays the same. So the signal-to-noise ratio becomes the fundamental problem.","Our approach has three parts. First, we use a two hundred sixty-six nanometer laser to increase the scattering cross section. Second, we use oblique incidence with p-polarized light, which reduces the surface haze. And third, we place a polarization filter in the collection path to further suppress the background.","This slide shows the optical layout. The laser hits the wafer at an angle of about seventy degrees, and the scattered light is collected by a high-NA objective. The wafer is spinning, and we scan the beam in a spiral pattern, so we can inspect a full three-hundred-millimeter wafer in about one minute.","Now for the results. Here we compare the detection rate with and without the polarization filter, using standard polystyrene latex particles. Without the filter, we detect almost all particles down to forty nanometers, but the rate drops sharply below that. With the filter, we achieve a capture rate of over ninety-five percent for twenty-six nanometer particles, while keeping the false count below one per wafer.","There is, of course, a trade-off. If we scan faster, the dwell time per pixel becomes shorter, and the sensitivity decreases. So the optimal operating point depends on the application. Let me stop here. Thank you."],"qa":[{"q":"Have you tested it on patterned wafers, or only on bare wafers?","a":"Only on bare wafers so far. Patterned wafers are much more challenging because the pattern itself scatters strongly. That's beyond the scope of this work, but we're planning to combine it with spatial filtering.","qaccent":"アメリカ"},{"q":"Does the ultraviolet laser damage the wafer surface or cause contamination?","a":"That's a good point. At our power level, we didn't observe any damage. But for long-term operation, we certainly can't rule out contamination on the optics, so we use a nitrogen purge.","qaccent":"ドイツ語なまり"}],"quiz":[{"q":"微粒子検出が難しい根本的な理由は？","a":"散乱強度が粒径の6乗に比例し、粒径半分で信号は1/64。一方、表面ヘイズ（背景）は変わらないためSNRが問題。"},{"q":"提案手法の3要素は？","a":"①266 nmレーザー ②p偏光の斜入射でヘイズ低減 ③集光側の偏光フィルタで背景抑制。"},{"q":"結果は？","a":"26 nm粒子で捕捉率95%以上、誤検出は1枚あたり1個未満。"},{"q":"トレードオフは？","a":"スキャンを速くすると画素あたりの滞在時間が短くなり感度が下がる。"}],"vocab":[{"en":"killer defect","ja":"致命欠陥"},{"en":"haze","ja":"ヘイズ（表面散乱）"},{"en":"oblique incidence","ja":"斜入射"},{"en":"capture rate","ja":"捕捉率"},{"en":"dwell time","ja":"滞在時間"}],"file":"audio/B03_t03.mp3","dur":222},{"id":"t04","cat":"talk","title":"Swept-source OCT for inline inspection","ja":"インライン検査のための波長掃引OCT","voice":"de-DE-ConradNeural","accent":"ドイツ語なまり","body":["Hello everyone. Today I will show how optical coherence tomography, which is well known in medicine, can be used for inline inspection in manufacturing.","The motivation is simple. Many industrial products, such as multilayer films, coatings, and bonded wafers, have internal defects that cannot be seen from the surface. X-ray methods are slow and expensive, and ultrasonic methods need contact or a coupling liquid. OCT is non-contact, fast, and gives us depth-resolved information.","We use a swept-source OCT system with a center wavelength of thirteen hundred nanometers and a sweep rate of two hundred kilohertz. The axial resolution in air is about ten micrometers, and the imaging depth is around five millimeters. To match the speed of the production line, we developed a line-scanning configuration with a galvo mirror synchronized with the conveyor.","Here is an example. This is a cross-sectional image of a laminated film. You can clearly see the three layers, and here, in the middle, there is a small void, about fifty micrometers wide. This void was not visible with the camera-based system that the factory used before.","One challenge was vibration. On a real production line, the sample moves up and down by several tens of micrometers. To compensate for this, we track the surface reflection in each A-scan and align the images in software. After correction, the layer thickness could be measured with a repeatability of one micrometer.","We also tested automatic void detection using a simple convolutional neural network. With about two thousand labeled images, the detection accuracy was ninety-eight percent. To conclude, swept-source OCT is a practical tool for inline inspection, especially for layered products. Thank you for listening."],"qa":[{"q":"What is the main limitation in terms of materials? For example, can you inspect strongly scattering materials?","a":"That is a very good question. For strongly scattering or absorbing materials, the penetration depth becomes very short, maybe a few hundred micrometers. So OCT works best for transparent or semi-transparent layers.","qaccent":"イギリス"},{"q":"How did you get the two thousand labeled images? Was labeling done manually?","a":"Yes, mostly manually, by the factory engineers. It took about two weeks. We are now looking at synthetic data to reduce this effort.","qaccent":"アメリカ"}],"quiz":[{"q":"OCTが他手法より優れている点は？","a":"X線は遅く高価、超音波は接触や液体が必要。OCTは非接触・高速で深さ方向の情報が得られる。"},{"q":"システムの主な仕様は？","a":"中心波長1300 nm、掃引200 kHz、軸方向分解能約10 μm（空気中）、深さ約5 mm。"},{"q":"振動対策は？","a":"各Aスキャンで表面反射を追跡し、ソフトウェアで画像を位置合わせ。厚さの繰り返し精度1 μm。"},{"q":"限界は？","a":"強散乱・強吸収材料では侵入深さが数百μmと浅い。透明・半透明の層に向く。"}],"vocab":[{"en":"swept-source","ja":"波長掃引光源"},{"en":"laminated film","ja":"積層フィルム"},{"en":"void","ja":"ボイド（空隙）"},{"en":"A-scan","ja":"Aスキャン（深さ方向1ライン）"},{"en":"penetration depth","ja":"侵入深さ"}],"file":"audio/B04_t04.mp3","dur":186},{"id":"t05","cat":"talk","title":"Hybrid laser integration on silicon","ja":"シリコン上へのハイブリッドレーザー集積","voice":"zh-CN-YunxiNeural","accent":"中国語なまり","body":["Thank you, chair. Good morning. My talk is about the hybrid integration of indium phosphide lasers on silicon photonics using flip-chip bonding.","As you know, silicon cannot emit light efficiently because of its indirect bandgap. So the laser is always the most difficult part of a silicon photonic transceiver. There are three main approaches: external lasers connected by fiber, heterogeneous integration by wafer bonding, and hybrid integration by flip-chip bonding. Each has advantages and disadvantages. In our work, we chose flip-chip because the lasers can be tested before bonding, which improves the yield.","The key challenge of flip-chip is alignment. The mode size of the laser is very small, so a vertical misalignment of only half a micrometer can increase the coupling loss by more than one dB. To solve this, we designed mechanical stoppers on the silicon chip and a mode converter on the laser side. With this structure, the alignment tolerance is enlarged to plus or minus one micrometer in the horizontal direction.","Let me show the results. We bonded twenty-four lasers on one wafer. The average coupling loss was one point eight dB, with a standard deviation of zero point three dB. The output power in the silicon waveguide was more than twenty milliwatts at a current of one hundred milliamps. We also measured the performance from twenty-five to eighty-five degrees, and the threshold current increased by about fifty percent at high temperature.","However, we found that back reflection from the silicon chip can make the laser unstable. To reduce it, we used an angled interface of eight degrees. After this change, the relative intensity noise was below minus one hundred forty dB per hertz.","In conclusion, flip-chip hybrid integration is a promising way to realize high-yield light sources for co-packaged optics. Thank you."],"qa":[{"q":"What was the bonding yield? Did all twenty-four lasers work after bonding?","a":"Twenty-two of twenty-four worked well. The two failures were caused by voids in the solder, so we think it can be improved by optimizing the bonding temperature.","qaccent":"アメリカ"},{"q":"Compared with heterogeneous integration, what about the cost?","a":"It depends on the volume. For small and medium volume, flip-chip is cheaper because we don't need a dedicated III-V process line. For very high volume, heterogeneous integration may become more competitive.","qaccent":"フランス語なまり"}],"quiz":[{"q":"光源集積の3つの方式は？","a":"①ファイバ接続の外部光源 ②ウェハ接合による異種集積 ③フリップチップによるハイブリッド集積。"},{"q":"フリップチップを選んだ理由は？","a":"接合前にレーザーを検査でき、歩留まりが上がるため。"},{"q":"位置合わせ対策は？","a":"Si側に機械的ストッパ、レーザー側にモード変換器。水平方向トレランス±1 μm。"},{"q":"戻り光への対策は？","a":"8度の斜め界面。RINは−140 dB/Hz以下に。"}],"vocab":[{"en":"flip-chip bonding","ja":"フリップチップ実装"},{"en":"alignment tolerance","ja":"位置合わせ許容誤差"},{"en":"threshold current","ja":"しきい値電流"},{"en":"back reflection","ja":"戻り光"},{"en":"RIN","ja":"相対強度雑音"}],"file":"audio/B05_t05.mp3","dur":202},{"id":"t06","cat":"talk","title":"Metalens objectives for compact inspection heads","ja":"小型検査ヘッドのためのメタレンズ","voice":"ko-KR-InJoonNeural","accent":"韓国語なまり","body":["Hello. I'm going to present a metalens-based objective for compact inspection heads.","In many inspection systems, the size and weight of the objective lens limit how many inspection heads we can place in parallel. If the heads are smaller, we can inspect a larger area at the same time and increase throughput. A metalens is a flat lens made of sub-wavelength nanostructures, so it can be much thinner and lighter than a conventional refractive lens.","However, metalenses have a well-known problem: strong chromatic aberration. Because the phase is controlled by diffraction, the focal length changes with wavelength. In our case, this is not a big problem, because the inspection uses a single laser wavelength of five hundred thirty-two nanometers.","Our metalens is made of amorphous silicon nanopillars on a glass substrate. The diameter is two millimeters, and the numerical aperture is zero point six. We designed the phase profile using a library of pillar diameters calculated by rigorous coupled-wave analysis.","This figure shows the measured point spread function. The full width at half maximum is about five hundred nanometers, which is close to the diffraction limit. The focusing efficiency is around seventy percent. We also imaged a resolution target, and the smallest resolved line was four hundred fifty nanometers.","Of course, the field of view is still small, and off-axis aberrations become large at the edge. In future work, we plan to use a doublet design to correct them. Thank you for your attention."],"qa":[{"q":"How did you fabricate the nanopillars? Is the process compatible with mass production?","a":"We used electron beam lithography for this prototype. But the minimum feature size is about one hundred nanometers, so we believe it can be transferred to deep UV lithography for mass production.","qaccent":"オーストラリア"},{"q":"Seventy percent efficiency sounds a bit low for inspection. Where does the remaining light go?","a":"Yes, you're right, it is one of the limitations. Most of the remaining light goes into the zeroth order and higher diffraction orders. It creates some background, but for our application it can be removed by a spatial filter.","qaccent":"アメリカ"}],"quiz":[{"q":"メタレンズを使う動機は？","a":"対物レンズが小型・軽量になれば検査ヘッドを多数並列に置けてスループットが上がる。"},{"q":"色収差が問題にならない理由は？","a":"検査が単一波長（532 nm）のレーザーだから。"},{"q":"レンズの仕様は？","a":"ガラス上のアモルファスSiナノピラー、直径2 mm、NA 0.6。"},{"q":"結果は？","a":"PSFの半値全幅約500 nm（回折限界に近い）、集光効率約70%、最小解像線幅450 nm。"}],"vocab":[{"en":"chromatic aberration","ja":"色収差"},{"en":"nanopillar","ja":"ナノピラー"},{"en":"RCWA","ja":"厳密結合波解析"},{"en":"point spread function","ja":"点像分布関数"},{"en":"off-axis","ja":"軸外"}],"file":"audio/B06_t06.mp3","dur":214},{"id":"t07","cat":"talk","title":"Deep learning for defect classification with few labels","ja":"少ないラベルでの欠陥分類（深層学習）","voice":"en-AU-NatashaNeural","accent":"オーストラリア","body":["Hi everyone. I'll be talking about how we can train defect classifiers for optical inspection when we only have a small number of labeled images.","In a typical fab, the inspection tool finds thousands of defect candidates per wafer, but only a few of them are reviewed by engineers. So we have huge amounts of images, but very few labels. On top of that, some defect types are extremely rare, maybe a few examples per month, and those are often the most important ones.","Our approach combines two ideas. The first is self-supervised pre-training. We train the network on about one million unlabeled images, so it learns what normal and abnormal patterns look like. The second is physics-based data augmentation. We use an optical simulator to generate synthetic images of rare defects under realistic illumination and focus conditions.","Let's have a look at the results. The baseline, trained only on labeled data, reaches an accuracy of eighty-one percent. With self-supervised pre-training, it goes up to eighty-nine percent. And when we add the synthetic images, we get ninety-four percent. More importantly, the recall for the rarest class improves from forty percent to eighty-five percent.","Now, a word of caution. Synthetic images only help if the simulator is accurate. When we deliberately used a wrong focus setting in the simulation, the accuracy actually dropped. So the physics really matters here.","To wrap up, combining self-supervised learning with physics-based simulation can drastically reduce the labeling effort. Thanks very much, and I'm happy to take questions."],"qa":[{"q":"Thank you. How long does it take to generate the synthetic images, and do you need a GPU cluster?","a":"Good question. It takes about one second per image on a single GPU, so generating ten thousand images takes a few hours. No cluster needed.","qaccent":"日本語なまり"},{"q":"Did you check whether the model generalizes to a different inspection tool?","a":"We tried it on a second tool of the same model, and the accuracy dropped by about three percent. For a completely different tool, we'd probably need some fine-tuning.","qaccent":"インド"}],"quiz":[{"q":"工場の欠陥データの問題点は？","a":"画像は大量だがラベルが少ない。重要な欠陥ほど稀。"},{"q":"2つのアイデアは？","a":"①約100万枚のラベルなし画像での自己教師あり事前学習 ②光学シミュレータによる物理ベースのデータ拡張。"},{"q":"精度の推移は？","a":"81% → 89%（事前学習）→ 94%（合成画像追加）。最稀少クラスの再現率は40% → 85%。"},{"q":"注意点は？","a":"シミュレータが不正確（例：フォーカス設定の誤り）だと逆に精度が落ちる。"}],"vocab":[{"en":"fab","ja":"半導体工場"},{"en":"self-supervised","ja":"自己教師あり"},{"en":"data augmentation","ja":"データ拡張"},{"en":"recall","ja":"再現率"},{"en":"fine-tuning","ja":"ファインチューニング"}],"file":"audio/B07_t07.mp3","dur":187},{"id":"t08","cat":"talk","title":"White-light interferometry on rough surfaces","ja":"粗面の白色干渉計測","voice":"fr-FR-HenriNeural","accent":"フランス語なまり","body":["Good afternoon, and thank you for staying for the last talk of the session. I will present a method to improve white-light interferometry on rough and steep surfaces.","White-light interferometry, or coherence scanning interferometry, is widely used to measure surface topography with sub-nanometer vertical resolution. It works very well on smooth surfaces. But on rough surfaces, or on steep slopes, the reflected signal is weak, and we often get missing data points or so-called batwing artifacts at the edges.","Our idea is to use the full interference signal instead of only the envelope peak. For each pixel, we fit a model of the signal that includes both the envelope and the phase. We also estimate a confidence value, so that unreliable points can be detected instead of producing wrong heights.","The experimental setup is a standard Mirau interferometer with a fifty-times objective and an LED source at five hundred sixty nanometers. We tested it on a step-height standard, on a machined metal surface, and on a micro-lens array.","On the step-height standard, the batwing artifact was reduced from about one hundred nanometers to less than ten nanometers. On the machined surface, the ratio of missing points decreased from twelve percent to less than two percent. The micro-lens array was the most difficult case because of the steep slopes near the edge, but we could still measure slopes up to twenty-five degrees.","The drawback is computation time. Our fitting is roughly five times slower than the conventional envelope detection. But with a GPU implementation, one measurement takes less than two seconds. Thank you very much."],"qa":[{"q":"How do you set the threshold for the confidence value? Is it the same for all samples?","a":"Currently we set it empirically, and yes, it is the same for all samples. It works, but a sample-dependent threshold would be better. That's something we want to investigate next.","qaccent":"アメリカ"},{"q":"Can your method be applied to transparent films, where there are multiple reflections?","a":"In principle, yes, but the signal model becomes more complicated, because there are two or more interfaces. We haven't tried that yet.","qaccent":"韓国語なまり"}],"quiz":[{"q":"白色干渉計の粗面・急斜面での問題は？","a":"反射信号が弱く、データ欠損やエッジでのバットウィング誤差が出る。"},{"q":"提案手法のアイデアは？","a":"包絡線ピークだけでなく干渉信号全体（包絡＋位相）をフィットし、信頼度も推定する。"},{"q":"結果は？","a":"バットウィング100 nm → 10 nm未満、欠損率12% → 2%未満、25度までの斜面を計測。"},{"q":"欠点は？","a":"計算が約5倍遅い。ただしGPU実装で1回2秒未満。"}],"vocab":[{"en":"topography","ja":"表面形状"},{"en":"envelope","ja":"包絡線"},{"en":"batwing artifact","ja":"バットウィング誤差"},{"en":"Mirau interferometer","ja":"ミロー干渉計"},{"en":"step-height standard","ja":"段差標準"}],"file":"audio/B08_t08.mp3","dur":170},{"id":"t09","cat":"talk","title":"Energy budget of optical I/O chiplets","ja":"光I/Oチップレットのエネルギー収支","voice":"ja-JP-KeitaNeural","accent":"日本語なまり","body":["Thank you, chair. I'm from Tokyo, and today I will talk about the energy budget of optical I/O chiplets.","Recently, optical I/O chiplets are attracting a lot of attention. The idea is to put a small photonic chip directly next to the processor, in the same package. But when people compare the energy per bit, they often use different definitions. Some include the laser, some don't. Some include the SerDes, some don't. So it is difficult to compare fairly.","In this work, we built a simple model that divides the total energy into four parts: the laser, the modulator and driver, the receiver, and the thermal tuning. Then we applied this model to ten published demonstrations.","Here is the result. As you can see in this bar chart, the laser is the largest contributor in most cases, about forty percent of the total. The second largest is the thermal tuning, especially for ring-based systems. Interestingly, the modulator driver is now relatively small, less than twenty percent.","This means that, to reduce the total energy, improving the laser wall-plug efficiency and reducing the thermal tuning power is more effective than improving the modulator. For example, if the wall-plug efficiency improves from ten percent to twenty percent, the total energy decreases by about twenty percent.","I know my model is simple, and the numbers have some uncertainty, maybe plus or minus thirty percent. But I hope it helps us to discuss energy efficiency with the same definition. Thank you for your attention."],"qa":[{"q":"Did you include the energy for clock recovery and forward error correction?","a":"No, we didn't include them in this model, because they depend strongly on the electrical design. But you're right, they're not negligible. I'll add them as an option in the next version.","qaccent":"イギリス"},{"q":"Where can we find your model? Is it open?","a":"Yes, the spreadsheet and the Python code are on GitHub. The link is on the last slide, and I'm happy to share it after the session.","qaccent":"アメリカ"}],"quiz":[{"q":"エネルギー比較の問題点は？","a":"レーザーやSerDesを含むかなど、定義がバラバラで公平に比較しにくい。"},{"q":"モデルの4分類は？","a":"レーザー、変調器とドライバ、受信器、熱チューニング。"},{"q":"最大の寄与は？","a":"多くの場合レーザー（全体の約40%）。次いで熱チューニング。"},{"q":"どこを改善すべきと結論したか？","a":"レーザーのウォールプラグ効率向上と熱チューニング電力削減。変調器改善より効果的。"}],"vocab":[{"en":"chiplet","ja":"チップレット"},{"en":"SerDes","ja":"シリアライザ/デシリアライザ"},{"en":"wall-plug efficiency","ja":"電力-光変換効率"},{"en":"thermal tuning","ja":"熱チューニング"},{"en":"clock recovery","ja":"クロック再生"}],"file":"audio/B09_t09.mp3","dur":184},{"id":"t10","cat":"talk","title":"Silicon nitride WDM filters with low thermal sensitivity","ja":"温度依存性の低い窒化シリコンWDMフィルタ","voice":"es-ES-AlvaroNeural","accent":"スペイン語なまり","body":["Good morning. Thank you for the opportunity to present our work on athermal wavelength division multiplexing filters in silicon nitride.","Wavelength division multiplexing is a key technology for increasing the bandwidth of co-packaged optics without increasing the number of fibers. But on-chip WDM filters are sensitive to temperature. In silicon, the resonance wavelength shifts by about eighty picometers per degree, so we normally need heaters and control loops, which consume power.","Silicon nitride has a thermo-optic coefficient about seven times smaller than silicon. In addition, we use a polymer cladding with a negative thermo-optic coefficient to compensate for the remaining shift. This is the idea of an athermal waveguide.","We designed an eight-channel arrayed waveguide grating with a channel spacing of four hundred gigahertz. The polymer thickness and the waveguide width were optimized so that the temperature dependence becomes almost zero at the center wavelength.","The measured spectra at twenty and seventy degrees are shown here. The wavelength shift is less than one picometer per degree, which is two orders of magnitude smaller than for silicon. The insertion loss is two point five dB, and the crosstalk is below minus twenty-five dB.","One concern is the long-term stability of the polymer. We performed damp heat testing at eighty-five degrees and eighty-five percent humidity for five hundred hours, and the shift was within ten picometers. Further testing is ongoing. Thank you."],"qa":[{"q":"The temperature dependence is almost zero only at the center wavelength, right? How about the edge channels?","a":"Yes, exactly. At the edge channels, it is slightly larger, about two picometers per degree. For a four hundred gigahertz spacing, this is acceptable.","qaccent":"シンガポール"},{"q":"Is the polymer compatible with the high temperatures of solder reflow?","a":"That's a very important point. Our polymer survives two hundred sixty degrees for a short time, but we have only tested three reflow cycles so far.","qaccent":"アイルランド"}],"quiz":[{"q":"シリコンWDMフィルタの問題は？","a":"共振波長が約80 pm/℃シフトし、ヒーターと制御ループが必要で電力を食う。"},{"q":"アサーマル化の2つの工夫は？","a":"①熱光学係数がSiの約1/7のSiNを使用 ②負の熱光学係数を持つポリマークラッドで残りを補償。"},{"q":"結果は？","a":"1 pm/℃未満（Siより2桁小さい）、挿入損失2.5 dB、クロストーク−25 dB以下。"},{"q":"信頼性試験は？","a":"85℃/85%RHで500時間、シフトは10 pm以内。"}],"vocab":[{"en":"athermal","ja":"温度無依存の"},{"en":"arrayed waveguide grating","ja":"アレイ導波路回折格子(AWG)"},{"en":"channel spacing","ja":"チャネル間隔"},{"en":"crosstalk","ja":"クロストーク"},{"en":"damp heat test","ja":"高温高湿試験"}],"file":"audio/B10_t10.mp3","dur":164},{"id":"qa1","cat":"qa","title":"質疑ドリル1：基本の質問","ja":"内容確認・理由・比較の質問に答える","voice":"en-US-AndrewNeural","accent":"いろいろ","items":[{"q":"Why did you choose silicon photonics instead of indium phosphide?","hint":"理由は2つ：CMOS互換で量産できる／電子回路と集積しやすい","a":"Thank you for the question. There are two main reasons. First, silicon photonics is CMOS compatible, so we can use existing foundries for mass production. Second, it's easier to integrate with electronic circuits.","qaccent":"イギリス"},{"q":"What is the main source of the propagation loss in your waveguide?","hint":"主因は側壁荒れによる散乱。プロセス改善で低減予定","a":"We believe the main source is scattering from sidewall roughness. We're now optimizing the etching process to reduce it.","qaccent":"インド"},{"q":"Did you measure the temperature dependence?","hint":"測った。20〜80度で変化0.5 dB以内","a":"Yes, we did. We measured it from twenty to eighty degrees, and the change was within zero point five dB.","qaccent":"アメリカ"},{"q":"How does your result compare with the state of the art?","hint":"表のとおり損失は同等、帯域は約2倍","a":"As shown in the comparison table, the loss is comparable to the best reported values, and the bandwidth is about twice as large.","qaccent":"中国語なまり"},{"q":"Can your method be applied to the O-band as well?","hint":"原理的には可能。設計の再最適化が必要","a":"In principle, yes. The physics is the same, but we would need to re-optimize the design for the shorter wavelength.","qaccent":"オーストラリア"},{"q":"How many devices did you measure? Is the result reproducible?","hint":"同一ウェハ上の12個を測定。ばらつきは±5%","a":"We measured twelve devices on the same wafer, and the variation was within plus or minus five percent.","qaccent":"ドイツ語なまり"},{"q":"What is the throughput of your inspection system?","hint":"1時間あたり約60枚。感度とトレードオフ","a":"Currently, it's about sixty wafers per hour. There's a trade-off with sensitivity, so it depends on the required detection limit.","qaccent":"アメリカ"},{"q":"Could you explain again how you calibrated the system?","hint":"既知サイズの標準粒子で校正した","a":"Sure. We calibrated it using standard particles with known sizes, and then we checked the linearity of the signal.","qaccent":"イギリス"},{"q":"What is the biggest difference between your approach and the previous work?","hint":"主な違いはアクティブ調芯が不要なこと","a":"The biggest difference is that our approach doesn't require active alignment, which reduces the assembly cost significantly.","qaccent":"フランス語なまり"},{"q":"What is your next step?","hint":"次は多チャネル化と長期信頼性評価","a":"Our next step is to scale it up to multiple channels and to evaluate the long-term reliability.","qaccent":"アメリカ"}],"file":"audio/C01_qa1.mp3","dur":304},{"id":"qa2","cat":"qa","title":"質疑ドリル2：鋭い・厳しい質問","ja":"限界の指摘・反論・未検証事項への対応","voice":"en-GB-RyanNeural","accent":"いろいろ","items":[{"q":"Your simulation and experiment differ by almost two dB. Doesn't that suggest your model is wrong?","hint":"指摘は理解。差は作製誤差で説明可能。測定した寸法で再計算すると一致","a":"I understand your concern. We think the difference comes from fabrication errors. When we re-ran the simulation using the measured dimensions, the agreement became much better.","qaccent":"アメリカ"},{"q":"I'm not convinced the improvement comes from your structure. Could it be just a better fabrication run?","hint":"その可能性は検討済み。同一ウェハ上の参照デバイスと比較した","a":"That's a fair question. To rule that out, we compared it with reference devices on the same wafer, and the improvement was still clear.","qaccent":"韓国語なまり"},{"q":"Five picojoules per bit doesn't include the laser, right? That seems a bit misleading.","hint":"いえ、レーザー込み。スライド12に内訳","a":"Actually, it does include the laser. Let me go back to slide twelve. Here is the breakdown, and the laser accounts for about two picojoules per bit.","qaccent":"インド"},{"q":"Have you considered the cost of this approach for mass production?","hint":"詳細なコスト分析はまだ。工程数は従来と同等","a":"We haven't done a detailed cost analysis yet. But the number of process steps is the same as the conventional process, so we don't expect a significant increase.","qaccent":"イギリス"},{"q":"Why didn't you compare with the method from the Stanford group?","hint":"条件が異なるため直接比較しなかった。後で議論したい","a":"Good point. Their measurement conditions were quite different, so a direct comparison wouldn't be entirely fair. But I'd be happy to discuss it after the session.","qaccent":"スペイン語なまり"},{"q":"What happens if the particle is on a patterned surface instead of a bare wafer?","hint":"本研究の範囲外。パターン散乱が強く難しい。今後の課題","a":"That's beyond the scope of this work. On patterned wafers, the pattern itself scatters strongly, so it's much more challenging. It's definitely part of our future work.","qaccent":"アメリカ"},{"q":"Is your neural network really learning defects, or just learning the background of each tool?","hint":"良い質問。別装置のデータでも精度低下は3%程度","a":"That's a very good question. We tested it on data from a different tool, and the accuracy dropped by only about three percent, so we think it's mostly learning the defects.","qaccent":"南アフリカ"},{"q":"How long does the device last? Any reliability data?","hint":"正直まだ。1000時間までは劣化なし","a":"To be honest, we don't have full reliability data yet. We've operated it for one thousand hours without any degradation, but more testing is needed.","qaccent":"アメリカ"},{"q":"Did you consider the effect of polarization?","hint":"考えていなかった。重要な指摘なので確認する","a":"Actually, we haven't looked into that carefully. That's an important point, so I'll check it and get back to you.","qaccent":"イタリア語なまり"},{"q":"Your error bars are quite large. Can you really claim a tenfold improvement?","hint":"最悪値同士でも5倍以上の改善はある","a":"That's a fair point. Even if we compare the worst cases, the improvement is still more than a factor of five, so the conclusion holds.","qaccent":"ナイジェリア"}],"file":"audio/C02_qa2.mp3","dur":375},{"id":"qa3","cat":"qa","title":"質疑ドリル3：ポスター・産業界からの質問","ja":"実用化・コスト・共同研究の会話","voice":"en-US-JennyNeural","accent":"いろいろ","items":[{"q":"So, what's the one-sentence summary of your poster?","hint":"一言で：光で欠陥を非接触・高速に見つける新手法","a":"In one sentence, it's a new method to find tiny defects quickly without touching the sample, using scattered light.","qaccent":"アメリカ"},{"q":"Is this something industry could use today, or is it still at the research stage?","hint":"まだ研究段階。2〜3年で試作機を目指す","a":"It's still at the research stage. We're aiming to build a prototype system within the next two to three years.","qaccent":"イギリス"},{"q":"What kind of samples have you tested so far?","hint":"シリコンウェハとガラス基板。金属は今後","a":"So far, we've tested silicon wafers and glass substrates. Metal surfaces are next on our list.","qaccent":"シンガポール"},{"q":"We have a similar problem at our company. Would you be interested in testing our samples?","hint":"ぜひ。名刺交換して後で連絡したい","a":"Yes, definitely! That would be very helpful for us. Shall we exchange business cards, and I'll email you after the conference?","qaccent":"ドイツ語なまり"},{"q":"How sensitive is the system to vibration in a factory environment?","hint":"除振台なしでは未評価。補正アルゴリズムは用意","a":"We haven't evaluated it without a vibration isolation table yet. But we've developed a software correction, which should help.","qaccent":"カナダ"},{"q":"How much does the light source cost?","hint":"正確な価格は不明だが、市販レーザーで数百万円程度","a":"I don't know the exact price, but it's a commercially available laser, so it's roughly in the range of tens of thousands of dollars.","qaccent":"中国語なまり"},{"q":"What was the hardest part of this project?","hint":"一番大変だったのはアライメント。半年かかった","a":"The hardest part was the alignment. It took us about six months to make the setup stable.","qaccent":"オーストラリア"},{"q":"Are you planning to publish this soon?","hint":"現在論文投稿中。プレプリントは来月","a":"Yes, we're currently preparing a journal paper, and we'll post a preprint next month.","qaccent":"アイルランド"},{"q":"If you had unlimited budget, what would you do differently?","hint":"より短波長の光源と高NA光学系を使いたい","a":"Ha, good question! I'd probably use a shorter-wavelength light source and higher-NA optics to push the detection limit further.","qaccent":"アメリカ"},{"q":"Do you have any plans to collaborate with other groups?","hint":"はい。特に機械学習の専門家と組みたい","a":"Yes, we're open to collaboration. In particular, we'd like to work with experts in machine learning for defect classification.","qaccent":"ケニア"}],"file":"audio/C03_qa3.mp3","dur":318},{"id":"d1","cat":"dialog","title":"コーヒーブレイクで初対面","ja":"隣に立った研究者と話し始める","voice":"en-GB-SoniaNeural","accent":"イギリス（相手）","lines":[{"who":"A","en":"Hi, is this the line for coffee?","ja":null},{"who":"B","en":"Yes, I think so. It's pretty long, isn't it?","ja":"そうだと思います。長いですね。"},{"who":"A","en":"It always is at this conference. I'm Emma, by the way. I'm at Southampton.","ja":null},{"who":"B","en":"Nice to meet you, Emma. I'm Ken, a PhD student from Tokyo.","ja":"はじめまして。東京から来た博士課程のケンです。"},{"who":"A","en":"Oh, nice. What are you working on?","ja":null},{"who":"B","en":"I work on optical inspection, mainly detecting tiny defects on wafers.","ja":"光学検査、主にウェハ上の微小欠陥検出の研究です。"},{"who":"A","en":"Interesting. Using scattering?","ja":null},{"who":"B","en":"Yes, dark-field scattering with a UV laser. How about you?","ja":"はい、UVレーザーの暗視野散乱です。あなたは？"},{"who":"A","en":"I do silicon photonic modulators, so quite different. Is this your first time here?","ja":null},{"who":"B","en":"Yes, it's my first international conference, so I'm a bit nervous.","ja":"初めての国際学会で少し緊張しています。"},{"who":"A","en":"Don't worry, everyone's really friendly. Are you presenting?","ja":null},{"who":"B","en":"Yes, I have a poster on Wednesday afternoon. You're welcome to stop by.","ja":"水曜午後にポスターがあります。ぜひ寄ってください。"},{"who":"A","en":"I'll try. Oh, it's our turn.","ja":null},{"who":"B","en":"Great. It was nice talking with you.","ja":"お話しできてよかったです。"}],"file":"audio/D01_d1.mp3","dur":219},{"id":"d2","cat":"dialog","title":"ポスターセッション","ja":"来訪者にポスターを説明する","voice":"en-IN-PrabhatNeural","accent":"インド（相手）","lines":[{"who":"A","en":"Hello, this looks interesting.","ja":null},{"who":"B","en":"Hi, thanks for stopping by. Would you like a quick overview?","ja":"寄ってくれてありがとう。概要を説明しましょうか？"},{"who":"A","en":"Sure, please.","ja":null},{"who":"B","en":"In a nutshell, we developed an optical method to detect particles smaller than thirty nanometers.","ja":"一言で言うと、30 nm以下の粒子を検出する光学手法を開発しました。"},{"who":"A","en":"Thirty nanometers with visible light?","ja":null},{"who":"B","en":"No, we use a UV laser at two hundred sixty-six nanometers, and we suppress the background with polarization.","ja":"いいえ、266 nmのUVレーザーで、偏光で背景を抑えています。"},{"who":"A","en":"I see. And how do you separate particles from surface roughness?","ja":null},{"who":"B","en":"Good question. The polarization of the scattered light is different, so we can filter out most of the roughness signal.","ja":"散乱光の偏光が違うので、粗さの信号はほぼ除去できます。"},{"who":"A","en":"What's the throughput?","ja":null},{"who":"B","en":"About one minute per wafer at the moment. There's a trade-off with sensitivity.","ja":"現在1枚約1分です。感度とのトレードオフがあります。"},{"who":"A","en":"Nice work. We're doing something similar for photomasks.","ja":null},{"who":"B","en":"Oh really? I'd love to hear more about that. Shall we exchange contact information?","ja":"本当ですか？詳しく聞きたいです。連絡先を交換しませんか？"}],"file":"audio/D02_d2.mp3","dur":245},{"id":"d3","cat":"dialog","title":"発表後に廊下で質問する","ja":"気になった発表者に話しかける","voice":"de-DE-ConradNeural","accent":"ドイツ語なまり（相手）","lines":[{"who":"B","en":"Excuse me, do you have a minute? I really enjoyed your talk on OCT.","ja":"すみません、少しいいですか？OCTの発表、とても良かったです。"},{"who":"A","en":"Oh, thank you. Sure.","ja":null},{"who":"B","en":"I had a question about the vibration correction. Do you track the surface in every A-scan?","ja":"振動補正について質問です。毎回のAスキャンで表面を追跡するんですか？"},{"who":"A","en":"Yes, exactly. We find the first strong reflection and align everything to it.","ja":null},{"who":"B","en":"What happens if the top layer is very thin? Doesn't the reflection overlap?","ja":"最上層がとても薄い場合は？反射が重なりませんか？"},{"who":"A","en":"Good point. In that case we fit two peaks, but the accuracy gets worse below about twenty micrometers.","ja":null},{"who":"B","en":"I see. In our lab, we use a similar approach for interferometry, so this was very helpful.","ja":"なるほど。うちでも干渉計で似た方法を使っているので、とても参考になりました。"},{"who":"A","en":"Glad to hear it. Which group are you in?","ja":null},{"who":"B","en":"I'm in an optics lab in Tokyo. Could I email you if I have more questions?","ja":"東京の光学系の研究室です。また質問があればメールしてもいいですか？"},{"who":"A","en":"Of course. Here's my card.","ja":null},{"who":"B","en":"Thank you very much. Enjoy the rest of the conference.","ja":"ありがとうございます。残りの学会も楽しんでください。"}],"file":"audio/D03_d3.mp3","dur":223},{"id":"d4","cat":"dialog","title":"懇親会（バンケット）","ja":"食事しながらの雑談","voice":"en-AU-WilliamMultilingualNeural","accent":"オーストラリア（相手）","lines":[{"who":"A","en":"Mind if I sit here?","ja":null},{"who":"B","en":"Not at all, please. I'm Ken, from Tokyo.","ja":"もちろんどうぞ。東京から来たケンです。"},{"who":"A","en":"Jack. I'm with a startup in Sydney. We make optical transceivers.","ja":null},{"who":"B","en":"Oh, that's a hot area these days, with the AI boom.","ja":"最近はAIブームで熱い分野ですね。"},{"who":"A","en":"Tell me about it! We can't hire people fast enough. What do you do?","ja":null},{"who":"B","en":"I'm working on optical interconnects too, mainly the packaging side.","ja":"私も光インターコネクト、主に実装側をやっています。"},{"who":"A","en":"Ah, packaging is the real bottleneck, isn't it?","ja":null},{"who":"B","en":"Exactly. Fiber attach is still really difficult. By the way, is this your first time in this city?","ja":"まさに。ファイバ実装はまだ難しいです。ところでこの街は初めてですか？"},{"who":"A","en":"No, third time. You should try the seafood place near the harbour.","ja":null},{"who":"B","en":"Thanks, I'll check it out. Have you ever been to Japan?","ja":"ありがとう、行ってみます。日本に行ったことはありますか？"},{"who":"A","en":"Once, for a conference in Kyoto. Loved it.","ja":null},{"who":"B","en":"If you come again, let me know. I'll show you around Tokyo.","ja":"また来るときは連絡してください。東京を案内します。"},{"who":"A","en":"Deal. Cheers!","ja":null},{"who":"B","en":"Cheers!","ja":"乾杯！"}],"file":"audio/D04_d4.mp3","dur":221},{"id":"d5","cat":"dialog","title":"企業の人と共同研究の相談","ja":"興味を持った企業研究者と次につなげる","voice":"en-US-EmmaNeural","accent":"アメリカ（相手）","lines":[{"who":"A","en":"Hi, I saw your poster yesterday. I work for an inspection equipment company.","ja":null},{"who":"B","en":"Oh, thank you for coming back. Did you have a question?","ja":"また来てくれてありがとうございます。何か質問が？"},{"who":"A","en":"Actually, we're interested in your polarization filtering technique. Have you tried it on glass substrates?","ja":null},{"who":"B","en":"Only a few samples so far, but the results were promising.","ja":"まだ数サンプルですが、良い結果でした。"},{"who":"A","en":"We have many glass samples with known defects. Would you be interested in testing them?","ja":null},{"who":"B","en":"That would be great. Real samples are exactly what we need.","ja":"ぜひ。まさに実サンプルが必要でした。"},{"who":"A","en":"Of course, we'd need an NDA first.","ja":null},{"who":"B","en":"Understood. I'll need to discuss it with my supervisor, but I think it's possible.","ja":"了解です。指導教員と相談が必要ですが、可能だと思います。"},{"who":"A","en":"Great. Let me give you my card. Just email me after the conference.","ja":null},{"who":"B","en":"Thank you. I'll email you next week with a short summary of our setup.","ja":"ありがとうございます。来週、装置の概要をまとめてメールします。"}],"file":"audio/D05_d5.mp3","dur":193},{"id":"e01","cat":"long","title":"Tutorial: Silicon photonics for optical interconnects","ja":"チュートリアル講演：光インターコネクトのためのシリコンフォトニクス入門","kind":"講義","voice":"en-US-BrianNeural","accent":"アメリカ・イギリス・インド","segments":[{"who":"Chair","en":"Good morning, everyone, and welcome to the tutorial session. Our first tutorial speaker needs little introduction. He has worked on silicon photonics for more than fifteen years, both in academia and in industry. Today he'll give us an overview of silicon photonics for optical interconnects. Please go ahead."},{"who":"Lecturer","en":"Thank you very much, and good morning. It's a pleasure to be here. This is a tutorial, so I'm going to start from the basics, and I'll try to avoid too many equations. If you're already an expert, I hope you'll still find a few useful perspectives, especially in the second half, where I'll talk about packaging and energy efficiency."},{"who":"Lecturer","en":"Let me begin with a simple question: why do we want to use light for interconnects at all? The answer is distance and bandwidth. When we send a high-speed electrical signal over a copper trace, the loss increases with frequency and with distance. At low data rates, this is not a big problem. But today, a single electrical lane runs at one hundred or two hundred gigabits per second, and at those speeds, a copper trace of just a few tens of centimeters can lose more than thirty dB. To recover the signal, we need equalizers, retimers, and digital signal processing, and all of these consume power. Optical fiber, on the other hand, has a loss of about zero point two dB per kilometer. For the distances inside a data center, the fiber loss is essentially zero. So the question is not whether light is better for transmission. It clearly is. The question is whether we can convert between electrical and optical signals cheaply and efficiently enough."},{"who":"Lecturer","en":"And this is where silicon photonics comes in. The basic idea is to build optical components using the same materials and the same fabrication tools that the electronics industry has developed over the last fifty years. Most silicon photonic devices are built on silicon-on-insulator wafers. A typical wafer has a silicon layer that is two hundred twenty nanometers thick, on top of a buried oxide layer that is two or three micrometers thick. Silicon has a refractive index of about three point five, and silicon dioxide has an index of about one point four five. This large index contrast is the key property of the platform. It means that light is very strongly confined in the silicon. A typical single-mode waveguide is only about five hundred nanometers wide, and we can bend it with a radius of just a few micrometers without significant loss. Compare that with an optical fiber, where the core is about nine micrometers in diameter and the bend radius is measured in millimeters or even centimeters."},{"who":"Lecturer","en":"Strong confinement is a big advantage for integration density, but it comes with a cost. Because the mode is so small, it interacts strongly with the sidewalls of the waveguide. Any roughness on the sidewalls scatters light. That's why the propagation loss of a silicon wire waveguide is typically one to three dB per centimeter, which is much higher than in lower-contrast platforms like silicon nitride. For short interconnects on a chip, this is usually acceptable, because the total waveguide length is only a few millimeters."},{"who":"Lecturer","en":"Now, let's go through the main building blocks of a transceiver. I like to think of it as four functions: getting light onto the chip, putting data onto the light, getting the light off the chip, and converting it back into an electrical signal. In other words, couplers, modulators, and photodetectors, plus the light source, which I'll come back to later."},{"who":"Lecturer","en":"First, coupling. This is one of the most underestimated problems in silicon photonics. The mode in a silicon waveguide is about half a micrometer in size, while the mode in a standard single-mode fiber is about ten micrometers. If you simply put the fiber against the chip, most of the light is lost. There are two common solutions. The first is the grating coupler. A grating etched into the waveguide diffracts the light upward, at a small angle, so the fiber can be placed above the chip. Grating couplers are convenient, because they allow wafer-scale testing, and the alignment tolerance is relatively large. However, they are polarization dependent, and they have a limited bandwidth, typically a few tens of nanometers. The second solution is the edge coupler, where the waveguide is tapered down at the edge of the chip, so the mode expands to match the fiber. Edge couplers have lower loss, often below one or two dB, and they work over a wide range of wavelengths and for both polarizations. But they require a polished facet and much more precise alignment. In practice, many products use edge couplers, and a lot of engineering effort goes into making fiber attachment fast and reliable."},{"who":"Lecturer","en":"Second, modulation. In indium phosphide or lithium niobate, we can use the electro-optic effect directly. Silicon, unfortunately, has no linear electro-optic effect, because its crystal structure is centrosymmetric. So instead, we use the plasma dispersion effect. When we change the concentration of free electrons and holes in silicon, the refractive index changes slightly. In a typical modulator, we embed a PN junction in the waveguide and apply a reverse bias. The depletion region becomes wider, the carrier concentration in the waveguide changes, and so does the phase of the light. This is called a carrier depletion modulator. The index change is small, on the order of ten to the minus four, so we need either a long phase shifter, as in a Mach-Zehnder modulator, or a resonant structure, like a micro-ring."},{"who":"Lecturer","en":"Let me say a few words about the trade-off between these two. A Mach-Zehnder modulator is robust. It works over a wide range of wavelengths and temperatures. But it's long, typically a few millimeters, so it needs traveling-wave electrodes and a driver with a relatively high voltage swing. A micro-ring modulator is tiny, maybe ten micrometers in diameter, and it can be driven with very low voltage and very low energy. It also naturally selects one wavelength, which is very convenient for wavelength division multiplexing. The catch, as many of you know, is temperature. The resonance of a silicon ring shifts by about eighty picometers per degree, so a temperature change of just a few degrees can push the ring completely off resonance. We need heaters and feedback control to keep it locked, and that control adds power and complexity."},{"who":"Lecturer","en":"Third, detection. Silicon is transparent at the telecom wavelengths of thirteen hundred and fifteen hundred fifty nanometers. That's great for waveguides, but it means silicon can't detect that light. The standard solution is to grow germanium on silicon. Germanium absorbs strongly at these wavelengths, and germanium photodetectors integrated with silicon waveguides now routinely achieve a responsivity of around one ampere per watt and bandwidths above fifty gigahertz. This was one of the big breakthroughs that made silicon photonics commercially viable."},{"who":"Lecturer","en":"And that brings me to the light source, which is the elephant in the room. Silicon has an indirect bandgap, so it can't emit light efficiently. There is no practical silicon laser. So every silicon photonic transceiver has to get its light from a III-V semiconductor, such as indium phosphide. There are basically three approaches. You can use an external laser and bring the light in through a fiber. You can attach a finished laser chip to the silicon chip, which we call hybrid integration. Or you can bond III-V material onto the silicon wafer and process it there, which we call heterogeneous integration. Each approach has its supporters, and I don't think there will be a single winner. For co-packaged optics, external laser sources are popular, because the laser is the component most likely to fail, and you want to be able to replace it without replacing the switch."},{"who":"Lecturer","en":"Now, let me move on to the second half of the tutorial, which is about systems and packaging. When people new to the field look at a silicon photonic transceiver, they often expect the photonic chip to be the expensive part. In reality, a large part of the cost is in packaging and testing: attaching fibers, managing heat, connecting the photonic chip to the electronic chip, and testing everything. A rule of thumb that I've heard many times in industry is that packaging and test can account for more than half of the total cost of a module."},{"who":"Lecturer","en":"This is also why co-packaged optics is such an interesting and challenging topic. In a co-packaged system, the optical engines sit right next to the switch chip, in the same package. The electrical path becomes very short, so we can reduce or even remove the power-hungry equalization and retiming. Several studies have estimated that this can reduce the interconnect power by thirty to fifty percent. But we now have to put optical fibers, lasers, and temperature-sensitive photonic devices inside a package that also contains one of the hottest chips in the data center. Thermal management, reliability, and serviceability all become critical."},{"who":"Lecturer","en":"When we talk about energy efficiency, the most common figure of merit is energy per bit, measured in picojoules per bit. A typical pluggable module today might be somewhere around fifteen picojoules per bit, including the DSP. Co-packaged optics targets something like five picojoules per bit or less. And research demonstrations of very short-reach optical links have reported values close to one picojoule per bit. But be careful when you compare these numbers. Different papers include different things. Some include the laser, some don't. Some include the electrical interface, some don't. My advice, especially to students, is to always ask: what exactly is included in this number?"},{"who":"Lecturer","en":"Let me finish with a few open challenges, which I think are great opportunities for research. First, the laser: we need efficient, reliable, and low-cost light sources, ideally with multiple wavelengths. Second, fiber attach: we need passive alignment and high-density fiber connections that can be assembled at high volume. Third, thermal control: we need ring-based systems that don't spend a large fraction of their power just staying on resonance. And fourth, testing: we need ways to test photonic chips at the wafer level, as quickly
